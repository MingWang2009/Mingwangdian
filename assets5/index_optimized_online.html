    original: "\n\n  其實啊，八風不動。八風吹得動嗎？吹的動是您自己\n  ，不是八風。八風就是\n  稱譏毀譽利衰苦樂。\n  那你為什麼會動？\n  因為你其實啊，你都把你那\n  個什麼視為真實。什麼\n  視為真實？\n  稱\n  稱讚。\n  或譏，譏就是\n  譏笑、諷刺。\n  毀，毀謗。\n  譽，就是名譽。\n  那利，利益，衰\n  ，衰敗。苦，苦惱\n  。樂，樂受。\n\n\n  其實這些，都是\n  實際上沒有在動\n  。它都是個緣境。\n  緣境就是一個境界\n  、一個緣。那是\n  眾生在動。\n  因為眾生有取捨。\n  因為眾生有執著，喜\n  好或什麼。眾生有一\n  種思維，認為說：「\n  我不能沒有稱讚，我\n  不能沒有利益，我不\n  能沒有快樂」\n  。他就很執著。\n  所以八風就會讓你\n  動。\n  其實不是八風吹得\n  動你。\n\n\n  是你自己內心給\n  自己的煩惱。那\n  你要怎麼不動？\n  你不要取捨、你\n  不要執著，你就\n  自然不動。\n  因為八風，它\n  不動。\n\n\n  那他說，什麼叫\n  做八風吹不動的\n  心？就是對這八\n  風吹拂不去執著。\n  你對這八風吹拂\n  你內心沒有執著。\n  你對這八風吹拂\n  你內心沒有取捨。\n  你對這八風吹拂\n  你內心不分別。\n  這樣才是八風吹\n  不動。\n\n\n  你對任何一切事情，\n  若是順境還是逆境。\n  你不分別，也不取捨\n  ，也不執著，這八風\n  就吹不動。因為，你\n  也不認為你得\n  到那個什麼利益就是\n  好，那個人讚歎你就\n  是好。\n\n\n  那個人毀謗你就是不\n  好。那個人說你怎樣\n  好。你如果覺得那個\n  好，他那個讚嘆的反\n  義就是毀謗。所以\n  你內心就是在取捨。\n  所以八風會吹得動你。\n\n\n  那你說，對你毀譽不\n  動，那你就自然做到\n  八風吹不動。\n\n\n  所以呢，其實我常常\n  跟各位講，就是呢，\n  我們知道，修行啊，\n  修心。修心不是你坐\n  在那裡，你就修得起\n  來。你修心，其實你\n  日常生活，你對你日\n  常生活的境界，你怎\n  麼去看待。這就是修\n  心。不是一天到晚念\n  經、拜佛、持咒，就\n  修心。\n\n\n  那你拜佛、持咒、念\n  經是為了什麼？就讓\n  你在日常生活面對境\n  界的時候，你能夠更\n  確定那個法的意義。\n  有那個法的力量，你\n  要去修行。所以修行\n  ，一定要有法，法的\n  力量是什麼？就是指\n  導你。\n  那不動的力量，就在\n  於你對境界有正知見。\n  正知見了，你就不會\n  被八風吹動。\n\n\n  所以呢，你只要保持\n  一個，你如果常常念\n  「你對一切行住坐臥\n  要沒有取捨」，你自\n  然就不會動。\n\n\n  你一遇到境界的時候\n  ，就是因為你有取捨。\n  我很喜歡他，我很討\n  厭他。我很喜歡那種\n  善的境界，我很討厭\n  那種惡的境界。我不\n  喜歡這個苦，我喜歡\n  那個樂。我不喜歡這\n  個衰敗，我喜歡那\n  個利益。\n\n\n  所以你才會被八風吹\n  動。你對八風沒有取\n  捨，一切平等，那八\n  風就吹不動。\n\n\n  所以呢，簡單的說，\n  就是，我們常說的一\n  句話：「一切無取捨\n  ，遠離心境」。遠離\n  心境是什麼意思？沒\n  有心境，就是沒有一\n  個心的境界。心的境\n  界，就是執著取捨分\n  別。你一切遠離，就\n  沒有心境。沒有心境\n  ，你就不會被動。\n\n\n  那我們修行，也不是\n  為了要學習什麼。\n  我們修行就是不執著\n  、不取捨。你把握這\n  個核心，你修行自然\n  就上路。\n",

    // ====== 小工具：debounce / RAF throttle ======
    const debounce = (fn, wait = 150) => {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    };

    // ====== Chart.js 延遲載入（需要圖表時才載） ======
    let chartJsPromise = null;
    function ensureChartJs() {
      if (window.Chart) return Promise.resolve();
      if (chartJsPromise) return chartJsPromise;
      chartJsPromise = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/chart.js";
        s.defer = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("Chart.js 載入失敗"));
        document.head.appendChild(s);
      });
      return chartJsPromise;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const selectMenu = document.getElementById("section-select");
      const contentContainer = document.getElementById("content-container");
      const mainHeader = document.getElementById("main-header");

      let isAutoScrolling = false;
      let scrollTimeoutId = null;

      // 動態維護 header 高度（讓 scroll-margin-top 更準）
      const updateHeaderHeightVar = () => {
        document.documentElement.style.setProperty("--header-h", `${mainHeader.offsetHeight}px`);
      };
      updateHeaderHeightVar();
      window.addEventListener("resize", debounce(updateHeaderHeightVar, 120), { passive: true });

      const sectionsList = [];
      const dataById = Object.create(null);

      // --- 1. 動態生成內容與下拉選單（用 DocumentFragment 減少重排） ---
      const optFrag = document.createDocumentFragment();
      const contentFrag = document.createDocumentFragment();

      dharmaData.forEach((item) => {
        dataById[item.id] = item;

        // 新增選項
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = `${item.id} ${item.title}`;
        optFrag.appendChild(option);

        // 生成內容區塊
        const section = document.createElement("article");
        section.id = `section-${item.id}`;
        section.dataset.id = item.id;
        section.className = "scroll-mt-header mb-10";

        section.innerHTML = `
          <div class="flex items-center justify-center gap-3 mb-5">
            <span class="text-sm font-semibold text-[#5F7161] bg-[#5F7161]/10 px-3 py-1.5 rounded-full tracking-wider shadow-sm flex items-center leading-none">${item.id}</span>
            <h3 class="text-2xl font-bold text-stone-800 tracking-wide flex items-center leading-none">${item.title}</h3>
          </div>

          <div class="bg-white/90 border border-[#D6CDBA]/60 p-6 md:p-8 rounded-2xl shadow-sm mb-5 relative">
            <p class="text-stone-700 leading-loose text-justify font-light text-[15px]">${item.original}</p>
          </div>

          <div class="flex justify-center">
            <button
              type="button"
              data-toggle="${item.id}"
              id="btn-${item.id}"
              aria-controls="explain-${item.id}"
              aria-expanded="false"
              class="inline-flex items-center justify-center gap-2 text-sm text-[#5F7161]/90 hover:text-[#5F7161] font-bold transition-all px-6 py-2.5 rounded-full tracking-widest bg-white border border-stone-200 shadow-sm hover:shadow-md"
            >
              <span id="icon-${item.id}" class="transition-transform duration-300 text-lg force-emoji flex items-center leading-none">☸️</span>
              <span id="text-${item.id}" class="flex items-center leading-none mt-[1px]">觀看實修解析</span>
            </button>
          </div>

          <div id="explain-${item.id}" class="reveal-content bg-stone-50/90 border border-stone-200 rounded-2xl px-6 sm:px-8 shadow-inner mt-2" role="region" aria-label="${item.id} ${item.title} 實修解析">
            <div class="py-6 text-stone-700 leading-relaxed font-light text-[15px]">
              ${item.explanation}
            </div>
          </div>
        `;

        sectionsList.push(section);
        contentFrag.appendChild(section);
      });

      selectMenu.appendChild(optFrag);
      contentContainer.appendChild(contentFrag);

      // --- 2. 下拉式選單跳轉（精確 offset） ---
      selectMenu.addEventListener("change", (e) => {
        const targetId = e.target.value;
        const targetElement = document.getElementById(`section-${targetId}`);
        if (!targetElement) return;

        isAutoScrolling = true;
        if (scrollTimeoutId) clearTimeout(scrollTimeoutId);

        const headerHeight = mainHeader.offsetHeight;
        const offsetPosition = targetElement.offsetTop - headerHeight - 30;

        window.scrollTo({ top: offsetPosition, behavior: "smooth" });

        scrollTimeoutId = setTimeout(() => { isAutoScrolling = false; }, 900);
      });

      // --- 3. 展開/收合：事件委派（移除 inline onclick） ---
      const chartInstances = Object.create(null);

      function toggleExplain(id) {
        const content = document.getElementById(`explain-${id}`);
        const btn = document.getElementById(`btn-${id}`);
        const btnText = document.getElementById(`text-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if (!content || !btn || !btnText || !icon) return;

        const isOpen = content.classList.contains("active");
        if (isOpen) {
          content.classList.remove("active");
          btnText.textContent = "觀看實修解析";
          icon.style.transform = "rotate(0deg)";
          btn.setAttribute("aria-expanded", "false");
          return;
        }

        content.classList.add("active");
        btnText.textContent = "收起解析";
        icon.style.transform = "rotate(90deg)";
        btn.setAttribute("aria-expanded", "true");

        // 若有圖表，延遲初始化確保容器尺寸正確，並延遲載入 Chart.js
        const dataItem = dataById[id];
        if (dataItem && dataItem.hasChart && !chartInstances[id]) {
          ensureChartJs().then(() => {
            setTimeout(() => {
              dataItem.initChart();
              chartInstances[id] = true;
            }, 120);
          }).catch(() => {
            // Chart.js 載入失敗時，不讓整頁壞掉
            chartInstances[id] = true;
            const region = document.getElementById(`explain-${id}`);
            if (region) {
              const warn = document.createElement("div");
              warn.className = "mt-4 text-sm text-stone-500";
              warn.textContent = "（提示）圖表載入失敗，請檢查網路或 CDN。";
              region.querySelector(".py-6")?.appendChild(warn);
            }
          });
        }
      }

      contentContainer.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-toggle]");
        if (!btn) return;
        toggleExplain(btn.dataset.toggle);
      });

      // --- 4. 精準滾動位置監聽（RAF throttle + 指標前後移動） ---
      let currentIndex = 0;
      let ticking = false;

      function updateSelectByScroll() {
        if (sectionsList.length === 0) return;

        const headerHeight = mainHeader.offsetHeight;
        const focal = window.scrollY + headerHeight + 80;

        while (currentIndex < sectionsList.length - 1 && sectionsList[currentIndex + 1].offsetTop <= focal) {
          currentIndex++;
        }
        while (currentIndex > 0 && sectionsList[currentIndex].offsetTop > focal) {
          currentIndex--;
        }

        const id = sectionsList[currentIndex].dataset.id || sectionsList[currentIndex].id.replace("section-", "");
        if (id && selectMenu.value !== id) selectMenu.value = id;
      }

      window.addEventListener("scroll", () => {
        if (isAutoScrolling) return;
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(() => {
            ticking = false;
            updateSelectByScroll();
          });
        }
      }, { passive: true });

      updateSelectByScroll();
    });
  </script>
</body>
