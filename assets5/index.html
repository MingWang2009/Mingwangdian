            {
                id: "10.13",
                title: "福德與功德",
                original: "為了廣告宣傳而行善，這是(毫無福德)的。因為福德已在宣傳中耗盡。行善喜歡人知，這是有我善，這是(有福德)的。行善不欲人知，這是無我善，這是(有功德)的。行善達到(三輪体空)這是(無邊功德)的。所以迴向一切達三輪体空，就如手中水倒入大海，佈施於法界，這說明了(迴向)的重要。",
                explanation: `
                    <p class="mb-4"><strong>實修要點：</strong>心量決定果報。將自己的小善透過「迴向」融入法界大海，功德便永不乾涸。</p>
                    <div class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">

            {
                id: "10.14",
                title: "無住相佈施",
                original: "金剛經云(有我相、有人相、有眾生相、有壽者相)即非菩薩。另云：菩薩應(不住相佈施、不住色聲香味觸法佈施)不住就是不記在心中的意思。有相只是人天善法的福德，這是會和身口意的惡業耗損的。無相無我才是菩薩道真功德，這功德如同大地，蘊育萬物，取之不盡。心經中(無智亦無得以無所得故)就是這道理。",
                explanation: `
                    <p><strong>實修要點：</strong>呼應 10.4 的三輪體空。修菩薩道若心中一直記掛著自己做了多少善事（住相），這股力量就會與日常犯的過錯（惡業）相抵銷。唯有「做了就忘」（無所得），才能回歸自性清淨的大地。</p>
                `
            },
            {
                id: "10.15",
                title: "五毒與戒定慧",
                original: "(貪婪、嗔恨、癡迷、慢傲、疑猜)這五毒，是慾望的延伸，侵蝕我們的心魔。我們必須時時反省，以(戒)五戒十善，(定)八風吹不動您心，(慧)聞慧、思慧、修慧這三學來改進達到(喜、怒、哀、樂、愛、惡)這六慾不生。(貪、嗔、癡、慢、疑)這五毒消滅，還您清淨的本質。",
                explanation: `
                    <p class="mb-4"><strong>實修要點：</strong>將毒藥轉化為清涼甘露的心法：</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                        <div class="border border-stone-200 bg-white p-5 rounded-xl shadow-sm">
                            <div class="text-[#5F7161] font-bold text-lg mb-2 border-b border-stone-100 pb-2">戒 <span class="text-sm font-normal text-stone-400 ml-1">防非止惡</span></div>
                            <p class="text-sm text-stone-600">以五戒十善約束行為，斬斷貪與癡的緣起。</p>
                        </div>
                        <div class="border border-stone-200 bg-white p-5 rounded-xl shadow-sm">
                            <div class="text-[#5F7161] font-bold text-lg mb-2 border-b border-stone-100 pb-2">定 <span class="text-sm font-normal text-stone-400 ml-1">安住不動</span></div>
                            <p class="text-sm text-stone-600">以不動心法面對八風，降伏嗔與慢的躁動。</p>
                        </div>
                        <div class="border border-stone-200 bg-white p-5 rounded-xl shadow-sm">
                            <div class="text-[#5F7161] font-bold text-lg mb-2 border-b border-stone-100 pb-2">慧 <span class="text-sm font-normal text-stone-400 ml-1">破迷開悟</span></div>
                            <p class="text-sm text-stone-600">以聞思修洞察實相，照破所有的疑猜無明。</p>
                        </div>
                    </div>
                `
            },
            {
                id: "10.16",
                title: "八正道",
                original: "師長者，應以(八正道)德相示眾。(正見)正確觀念與見解。(正思)要讓思維與正法相應。(正語)說話圓融不妄語、兩舌、惡口。(正業)身口意修行十善業。(正勤)不因我執法執而退轉道心。(正念)以四念處修心。(正命)道德生活和諧圓融淨化身心。(正定)八風吹不動您的心。 蓮師題",
                explanation: `
                    <p><strong>實修要點：</strong>八正道是佛教修行的標準地圖。從建立正確觀念（正見）開始，落實於語言（正語）、行為（正業）與生活方式（正命），配合精進不懈（正勤）與時刻覺察（正念），最終達到心境安穩（正定）。</p>
                `
            },
            {
                id: "10.17",
                title: "佛法六度簡單化",
                original: "佛法簡單化(佈施)就是行善，(持戒)就是止惡，(忍辱)就是轉念，(精進)就是進步，(禪定)就是穩定，(智慧)就是圓滿。",
                explanation: `
                    <p class="mb-4"><strong>實修要點：</strong>將深奧的菩薩六度波羅蜜，轉化為現代人易懂的六個行動指標。修行不偏廢，須如圓輪般均衡發展。</p>
                    <div class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                        <div class="chart-container">
                            <canvas id="chart-10-17"></canvas>
                        </div>
                    </div>
                `,
                hasChart: true,
                chartId: 'chart-10-17',
                initChart: function() {
                    const ctx = document.getElementById('chart-10-17').getContext('2d');
                    new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['行善 (佈施)', '止惡 (持戒)', '轉念 (忍辱)', '進步 (精進)', '穩定 (禪定)', '圓滿 (智慧)'],
                            datasets: [{
                                label: '菩薩道實踐',
                                data: [100, 100, 100, 100, 100, 100],
                                backgroundColor: 'rgba(95, 113, 97, 0.15)',
                                borderColor: '#5F7161',
                                pointBackgroundColor: '#5F7161',
                                pointBorderColor: '#fff',
                                borderWidth: 2

                        },
                        options: {

                            scales: {

                                    grid: { color: '#E7E5E4' },
                                    pointLabels: { color: '#57534E', font: { family: "'Noto Serif TC', serif", size: 13, weight: '500' } },
                                    ticks: { display: false, max: 100, min: 0 }
                                }

                    });

            },
            {
                id: "10.18",
                title: "迷與覺的選擇",
                original: "其實(婆娑)與(涅槃)都俱足在您的心裡面，也就是(迷)與(覺)。是迷於塵世而煩惱枷鎖或覺於真心而清淨自在，就在於您自己的選擇。",
                explanation: `
                    <p><strong>實修要點：</strong>淨土與地獄不在遠方，而在當下一念之間。念頭一轉，看破執著，當下即是清淨自在的涅槃。</p>
                `
            },
            {
                id: "10.19",
                title: "無相修心與家庭和諧",
                original: "家庭和諧從(心)開始，心可以讓您成為天使，心也可以讓您變成魔鬼。師兄所講無相修心，並不是要您放下塵緣，而是要您承擔家庭的責任，圓滿塵緣。無相修心，是要您不比較、不計較，遇事穩定情緒不嗔怒，別贏在嘴上，卻失去家庭和諧。",
                explanation: `
                    <p><strong>實修要點：</strong>真正的修行道場就在家庭。藉口修行而逃避家庭責任，是錯誤的。在處理家庭瑣事中，練習「不比較、不計較、不嗔怒」，才是真功夫。<strong>「別贏在嘴上，卻失去家庭和諧」</strong>是居家修行的金科玉律。</p>
                `
            },
            {
                id: "10.20",
                title: "真正的快樂",
                original: "(快樂)與財富或成走到完全無關的，富有的人未必會快樂，成就高的人也未必快樂。而真正的快樂是心靈的寧靜、身體的健康、親情的圓滿、知足的平凡。",
                explanation: `
                    <p><strong>實修要點：</strong>外在的物質與成就有其極限，且伴隨患得患失的恐懼。將追求快樂的方向向內轉，體會「知足」帶來的平靜與平凡中的偉大。</p>
                `
            },
            {
                id: "10.21",
                title: "四大經典真諦",
                original: "師兄禮讚佛陀，2600年前的智慧。以(金剛經)敘述了心靈無染。以(地藏經)敘述了婆娑世界。以(彌陀經)敘述了極樂世界。以(普門品)渡化眾生，了解人生來去，智慧真諦。",
                explanation: `
                    <p><strong>實修要點：</strong>這勾勒出大乘佛法的宏觀架構：</p>
                    <ul class="list-none mt-3 space-y-2 text-stone-600 bg-white p-5 border border-stone-100 rounded-lg shadow-sm">
                        <li><strong class="text-[#5F7161]">《金剛經》：</strong>空性智慧，破除一切執著。</li>
                        <li><strong class="text-[#5F7161]">《地藏經》：</strong>明辨因果，認識婆娑世界的苦難運作。</li>
                        <li><strong class="text-[#5F7161]">《彌陀經》：</strong>指引歸依，建立對清淨國土的信願。</li>
                        <li><strong class="text-[#5F7161]">《普門品》：</strong>慈悲入世，學習觀音菩薩的應機渡化。</li>
                    </ul>
                `
            },
            {
                id: "10.22",
                title: "妙行無住與上德不德",
                original: "金剛經中的(妙行無住)解釋為：智慧的行者，是不會把自己的善行義舉放在心裡的。這與道教清淨經內的(上德不德)解釋為：真正有德性的人是不會執著他做了多少功德。兩句的意義理是相通的。",
                explanation: `
                    <p><strong>實修要點：</strong>真理是跨越宗教派別的。無論佛道，皆指出「執著於功德，便失去功德」的宇宙法則。行善如呼吸般自然，不求回報，方為大德。</p>
                `
            },
            {
                id: "10.23",
                title: "三藏與十二部經",
                original: "三藏(經藏)佛陀弟子記載下來的經書。(律藏)團體的戒律法典。(論藏)佛教各宗對佛法的修行論議。十二部指的是長行、重頌、孤起、譬喻、因緣、無問說、本生、本事、未曾有、方廣、論議、授記。以上12種方式。",
                explanation: `
                    <p><strong>實修要點：</strong>了解佛教經典的分類架構。「經」定方向，「律」定行為，「論」釋義理。十二部經則是佛陀依據不同體裁與對象說法的方式。</p>
                `
            },
            {
                id: "10.24",
                title: "因材施教的智慧",
                original: "十二部經，就是教導弟子了解佛法的方式... 這以是對弟子因材施教的十二種方式。重理論的弟子就以(方廣)與(論議)說教。喜歡神通的就以(未曾有)來說教。這與觀世音普門品內(應以自在天得度者即現自在天而為說法，應以小王身得度者即現小王身而為說法)是義理相通的。",
                explanation: `
                    <p><strong>實修要點：</strong>學習佛菩薩「應機說法」的智慧。在世間與人溝通、教導子女或帶領團隊時，不應堅持單一方式，而應觀察對方的根器與喜好，用對方聽得懂、能接受的方式引導。</p>
                `
            },
            {
                id: "10.25",
                title: "修心之重要",
                original: "所謂(心猿意馬)、(心如電光)、(心如野鹿逐聲色)、(心如冤家身受苦)、(心如畫師描彩繪)、(三心二意)、(鬼迷心竅)以上每句都表示(心)，有千變萬化的思慮與妄想。可見修心是何等的重要。",
                explanation: `
                    <p><strong>實修要點：</strong>正視心智難以馴服的本質。不用去壓抑念頭，而是先「察覺」它的千變萬化。當你意識到「心猿意馬」正在發生時，覺知就已經開始了。</p>
                `
            },
            {
                id: "10.26",
                title: "善護三業",
                original: "善護身業，不失律儀；善護口業，不譏他過；善護意業，清淨無染。檢自端身，身心潔淨，擇其善道，勤而行之。以上共勉力。",
                explanation: `
                    <p><strong>實修要點：</strong>這是日用平常的護身符。不論讀了多少經典，最終都要落實於「管好身體不越矩、管好嘴巴不論非、管好心念不沾染」。</p>
                `
            },
            {
                id: "10.27",
                title: "修行總綱領",
                original: "因果業報，真實不虛；生死事大，無常迅速，應修解脫。世界財產，夢幻泡影；少慾為基，常修四聖諦，常修八正道、五戒十善。明了十二因緣。學習八風不動心。內觀自心，本來清淨，修深般若波羅蜜，了知諸法，心不執著，身隨所安，妄念起時，勿隨勿制，不起愛憎，我見破盡，心一境性，即印佛記。 蓮師題。釋明法翻譯。",
                explanation: `
                    <p><strong>實修要點：</strong>這段文字是整篇的精華濃縮，涵蓋了小乘出離心到大乘般若慧。特別注意對治妄念的心訣：<strong>「妄念起時，勿隨勿制，不起愛憎」</strong>。不跟著妄念走，也不強壓制它，保持中立的覺察，最終達到「心一境性」。</p>
                `
            },
            {
                id: "10.28",
                title: "四聖諦",
                original: "(四聖諦)即是心經中的(苦集滅道)。苦：人生有八大苦，身體有(生老病死)的痛苦。心裡有(愛別離苦、求不得苦、怨憎恨苦、五蘊熾盛苦)。集：合這些苦的業報，修行者必須以行善積德，消除。滅：這些業障，轉向八正道。正見、正思、正語、正業、正命、正勤、正念、正定。",
                explanation: `
                    <div class="space-y-4">
                        <p><strong>實修要點：</strong>看透因果邏輯，掌握解脫之匙。</p>
                        <div class="flex flex-col md:flex-row gap-3 text-center text-sm">
                            <div class="flex-1 bg-white border border-stone-200 shadow-sm p-4 rounded-lg"><strong class="text-[#5F7161] text-lg block border-b border-stone-100 pb-2 mb-2">苦 (現象)</strong>認清世間八大苦的現象。</div>
                            <div class="hidden md:flex items-center justify-center text-stone-300 text-xl">➔</div>
                            <div class="flex-1 bg-white border border-stone-200 shadow-sm p-4 rounded-lg"><strong class="text-[#5F7161] text-lg block border-b border-stone-100 pb-2 mb-2">集 (原因)</strong>找尋造成痛苦的業障與煩惱。</div>
                        </div>
                        <div class="flex flex-col md:flex-row gap-3 text-center text-sm mt-2">
                            <div class="flex-1 bg-[#5F7161]/5 border border-[#5F7161]/20 shadow-sm p-4 rounded-lg"><strong class="text-[#5F7161] text-lg block border-b border-[#5F7161]/10 pb-2 mb-2">滅 (目標)</strong>設定消除業障、得清淨的目標。</div>
                            <div class="hidden md:flex items-center justify-center text-[#5F7161]/40 text-xl">➔</div>
                            <div class="flex-1 bg-[#5F7161]/5 border border-[#5F7161]/20 shadow-sm p-4 rounded-lg"><strong class="text-[#5F7161] text-lg block border-b border-[#5F7161]/10 pb-2 mb-2">道 (方法)</strong>實踐八正道，作為達標的方法。</div>
                        </div>
                    </div>
                `
            },
            {
                id: "10.29",
                title: "破除五蘊熾盛",
                original: "色、受、想、行、識，稱為五蘊。色就是物質，也就是對這世間所有的物質太多的感受產生了思想，有了行為和意識。不惜傷害眾生而取得，這稱為五蘊熾盛。五戒：不殺生、不偷盜、不邪念、不妄語、不毒癮。修解脫是修清淨心... 當妄念起時，讓您的內心起了貪、嗔、癡、慢、疑，不要隨著讓身與口有造了身業與口業，也不要沒有思考或轉念而強制忍著，必須聞思修後，轉念而(不起愛憎)...",
                explanation: `
                    <p><strong>實修要點：</strong>此段點出凡夫造業的心理機制：面對物質（色），過度感受（受），產生貪念（想），付諸奪取（行），留下執著（識）。修行不能只是「強忍」，強忍如定時炸彈；必須透過「聞思修」明白道理後，從心底「轉念」，才能真正放下而不起愛憎。</p>
                `
            },
            {
                id: "10.31",
                title: "識破煩惱魔障",
                original: "(煩惱)是學佛最大的魔障，它讓我們不得自在，所以又稱：束縛、結，它能污染我們的心性，所以又稱：垢。在觀世音菩薩普門品中，火燄、毒箭、虎狼、險坑、枷鎖、毒藥、羅煞、惡獸、氣毒，字字句句，都是直指(煩惱火)(慾望水)希望各位能了解修行，去除(無明煩惱)的重要。",
                explanation: `
                    <p><strong>實修要點：</strong>誦讀《普門品》時，不要只看作是躲避外在的災難。真正的猛獸與烈火，是內心的嗔恨與貪慾。降伏自己的煩惱心，才是真正的菩薩保佑。</p>
                `
            },
            {
                id: "11.6",
                title: "般若智慧的次第",
                original: "佛陀是著重智慧的覺者。有智慧，才能分辨善惡是非，才能內化去斷除煩惱，才能證悟如來。若只修福田，福報再大，還是不能究竟涅槃。所以學佛除了要培福以外，更要具足智慧。而智慧必須由了解(文字般若)，然後自覺(觀照般若)，才能智慧增長到達(實相般若)。能與諸佛菩薩以心印心。",
                explanation: `
                    <p class="mb-3"><strong>實修要點：</strong>福慧必須雙修。修慧有三個漸進的階段：</p>
                    <ol class="list-decimal pl-5 space-y-2 text-stone-600">
                        <li><strong class="text-stone-800">文字般若：</strong>讀經聽法，建立正知見（如閱讀此篇筆記）。</li>
                        <li><strong class="text-stone-800">觀照般若：</strong>將佛理應用於生活，時刻觀照起心動念與外在境界。</li>
                        <li><strong class="text-stone-800">實相般若：</strong>功力水到渠成，親自證悟空性，與佛心相印。</li>
                    </ol>
                `
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const selectMenu = document.getElementById('section-select');
            const contentContainer = document.getElementById('content-container');
            const mainHeader = document.getElementById('main-header');
            
            // 用於處理手動滾動與監聽器之間的狀態，避免衝突
            let isAutoScrolling = false;
            let scrollTimeoutId = null;
            const sectionsList = [];
            
            // --- 1. 動態生成內容與下拉選單 ---
            dharmaData.forEach((item) => {
                // 新增選項至下拉表單
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = `${item.id} ${item.title}`;
                selectMenu.appendChild(option);

                // 生成主畫面內容區塊
                const section = document.createElement('article');
                section.id = `section-${item.id}`;
                section.className = "scroll-mt-24"; // 作為備用定位點
                
                section.innerHTML = `
                    <div class="flex items-center gap-3 mb-4">
                        <span class="text-xs font-semibold text-[#5F7161] bg-[#5F7161]/10 border border-[#5F7161]/20 px-2 py-1 rounded shadow-sm">${item.id}</span>
                        <h3 class="text-2xl font-bold text-stone-800">${item.title}</h3>
                    </div>
                    
                    <div class="bg-white border-l-4 border-[#D6CDBA] p-5 md:p-7 rounded-r-xl shadow-sm mb-4 relative">
                        <p class="text-stone-700 leading-loose text-justify font-light">${item.original}</p>
                    </div>
                    
                    <button onclick="toggleExplain('${item.id}')" id="btn-${item.id}" class="inline-flex items-center gap-2 text-sm text-[#5F7161]/80 hover:text-[#5F7161] font-bold transition-colors px-2 py-1 rounded-md tracking-widest">
                        <span id="icon-${item.id}" class="transition-transform duration-300 text-lg force-emoji">☸️</span>
                        <span id="text-${item.id}">觀看實修解析</span>
                    </button>
                    
                    <div id="explain-${item.id}" class="reveal-content bg-stone-50/80 border border-stone-200 rounded-xl px-6 sm:px-8 shadow-inner">
                        <div class="py-6 text-stone-700 leading-relaxed font-light">
                            ${item.explanation}
                        </div>
                    </div>
                `;
                
                contentContainer.appendChild(section);
                sectionsList.push(section);
            });

            // --- 2. 下拉式選單跳轉邏輯 (精準偏移量計算) ---
            selectMenu.addEventListener('change', (e) => {
                const targetId = e.target.value;
                if (targetId) {
                    const targetElement = document.getElementById(`section-${targetId}`);
                    if (targetElement) {
                        // 鎖定滾動監聽器，避免下拉選單在跳轉過程中反覆跳動
                        isAutoScrolling = true;
                        if (scrollTimeoutId) clearTimeout(scrollTimeoutId);

                        const headerHeight = mainHeader.offsetHeight;
                        // 計算元素相對於整個頁面頂端的絕對位置，扣除導覽列高度與一些緩衝空間(30px)
                        const offsetPosition = targetElement.offsetTop - headerHeight - 30;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });

                        // 給予平滑滾動足夠的時間完成後，再解鎖滾動監聽 (1000ms)
                        scrollTimeoutId = setTimeout(() => {
                            isAutoScrolling = false;
                        }, 1000);
                    }
                }
            });

            // --- 3. 精準滾動位置監聽 (取代原本的 IntersectionObserver) ---
            // 因為區塊長短不一，使用計算 top 位置的方式比 Observer 判定範圍更準確
            window.addEventListener('scroll', () => {
                // 如果是透過選單觸發的自動滾動，則暫時不更新選單狀態
                if (isAutoScrolling) return;

                const headerHeight = mainHeader.offsetHeight;
                // 焦點基準線：設定在導覽列下方約 80px 的位置
                const scrollFocalPoint = window.scrollY + headerHeight + 80;
                
                let currentSectionId = '';

                // 檢查所有段落的位置，找出最接近且已越過基準線的段落
                for (let i = 0; i < sectionsList.length; i++) {
                    const section = sectionsList[i];
                    if (section.offsetTop <= scrollFocalPoint) {
                        currentSectionId = section.id.replace('section-', '');
                    } else {
                        break; // 因為段落是按順序排列，後面的不需要再檢查
                    }
                }

                // 特殊情況：如果在頁面最頂端，預設選取第一個
                if (window.scrollY === 0 && sectionsList.length > 0) {
                    currentSectionId = sectionsList[0].id.replace('section-', '');
                }

                // 若當前段落有改變，則更新下拉選單的值
                if (currentSectionId && selectMenu.value !== currentSectionId) {
                    selectMenu.value = currentSectionId;
                }
            });
        });

        // --- 互動邏輯：展開/收合解析區塊 ---
        const chartInstances = {};

        function toggleExplain(id) {
            const content = document.getElementById(`explain-${id}`);
            const btnText = document.getElementById(`text-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            
            if (content.classList.contains('active')) {
                // 執行收合
                content.classList.remove('active');
                btnText.textContent = "觀看實修解析";
                icon.style.transform = "rotate(0deg)";
            } else {
                // 執行展開
                content.classList.add('active');
                btnText.textContent = "收起解析";
                icon.style.transform = "rotate(90deg)"; // 小圖示旋轉特效
                
                // 若有圖表，延遲初始化確保容器尺寸正確
                const dataItem = dharmaData.find(d => d.id === id);
                if (dataItem && dataItem.hasChart && !chartInstances[id]) {
                    setTimeout(() => {
                        dataItem.initChart();
                        chartInstances[id] = true;
                    }, 400); 
                }
            }
        }
    </script>
</body>
</html>
