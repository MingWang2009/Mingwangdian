            else {
                htmlContent = `
                    <div class="mb-5 text-[#9C7E5A] tracking-[0.2em] text-sm font-bold flex items-center gap-3">
                        <span class="w-6 h-[1px] bg-[#9C7E5A]"></span> ${data.title}
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold text-[#A63A32] mb-10 pb-6 border-b border-[#E8E4DB] tracking-widest leading-loose text-center">
                        「${data.sutra}」
                    </h2>
                    <div class="mb-10 text-[#4A3B32]">
                        ${data.body}
                    </div>
                `;

                // Add Takeaway Box if it exists
                if (data.takeawayTitle) {
                    htmlContent += `
                        <div class="mt-12 bg-[#F5F4F1] p-8 rounded-sm border-l-4 border-[#A63A32]">
                            <h3 class="text-lg font-bold text-[#2B231D] mb-4 tracking-widest">進入佛門${data.title}：<span class="text-[#A63A32]">【${data.takeawayTitle}】</span></h3>
                            <p class="text-[#4A3B32] leading-loose text-justify">${data.takeawayBody}</p>
                        </div>
                    `;
                }

                // 底部上下單元導覽按鈕
                const currentIndex = sutraData.findIndex(item => item.id === id);
                let bottomNavHtml = '<div class="flex flex-col md:flex-row justify-between items-center mt-12 pt-8 border-t border-[#E8E4DB] gap-4">';

                // 上一單元按鈕
                if (currentIndex > 0) {
                    const prevItem = sutraData[currentIndex - 1];
                    bottomNavHtml += `<button onclick="loadContent('${prevItem.id}', true)" class="w-full md:w-auto text-center md:text-left px-6 py-3 rounded-sm border border-[#E8E4DB] bg-[#F5F4F1] text-[#4A3B32] hover:bg-white hover:border-[#A63A32] hover:text-[#A63A32] transition-all shadow-sm tracking-widest"><span class="text-[10px] mr-2 text-[#9C7E5A]">▲</span>上一單元：${prevItem.title}</button>`;
                } else {
                    bottomNavHtml += `<div class="hidden md:block w-full md:w-auto"></div>`; 
                }

                // 下一單元按鈕
                if (currentIndex < sutraData.length - 1) {
                    const nextItem = sutraData[currentIndex + 1];
                    bottomNavHtml += `<button onclick="loadContent('${nextItem.id}', true)" class="w-full md:w-auto text-center md:text-right px-6 py-3 rounded-sm border border-[#E8E4DB] bg-[#F5F4F1] text-[#4A3B32] hover:bg-white hover:border-[#A63A32] hover:text-[#A63A32] transition-all shadow-sm tracking-widest">下一單元：${nextItem.title}<span class="text-[10px] ml-2 text-[#9C7E5A]">▼</span></button>`;
                } else {
                    bottomNavHtml += `<div class="hidden md:block w-full md:w-auto"></div>`;
                }
                
                bottomNavHtml += '</div>';
                htmlContent += bottomNavHtml;
            }

            container.innerHTML = htmlContent;
            container.classList.add('fade-in');

            // Handle Chart logic
            if (data.hasChart) {
                setTimeout(renderChart, 100);
            } else if (currentChartInstance) {
                currentChartInstance.destroy();
                currentChartInstance = null;
            }

            // 滾動定位邏輯
            if (shouldScroll) {
                setTimeout(() => {
                    const yOffset = window.innerWidth < 768 ? -100 : -40; 
                    const y = container.getBoundingClientRect().top + window.scrollY + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }, 150);
            }
        }

        // Custom Interaction for Lesson 9 (六根六塵)
        function highlightDust(rootId) {
            // 重置所有六塵
            document.querySelectorAll('.dust-item').forEach(el => {
                el.classList.remove('bg-[#2B231D]', 'border-[#40352C]', 'text-[#F5F4F1]', 'shadow-md');
                el.classList.add('bg-white', 'border-transparent', 'text-[#C4BDB5]');
            });
            // 重置所有六根
            document.querySelectorAll('.root-btn').forEach(el => {
                el.classList.remove('border-[#A63A32]', 'bg-white');
                el.classList.add('border-[#E8E4DB]', 'bg-[#F5F4F1]');
            });

            // 高亮選擇的六根
            event.currentTarget.classList.remove('border-[#E8E4DB]', 'bg-[#F5F4F1]');
            event.currentTarget.classList.add('border-[#A63A32]', 'bg-white');

            // 高亮對應的六塵
            const dustId = `dust-${rootId}`;
            const targetDust = document.getElementById(dustId);
            if (targetDust) {
                targetDust.classList.remove('bg-white', 'border-transparent', 'text-[#C4BDB5]');
                targetDust.classList.add('bg-[#2B231D]', 'border-[#40352C]', 'text-[#F5F4F1]', 'shadow-md');
            }
        }

        // Chart.js Rendering for Lesson 10 (十二因緣)
        function renderChart() {
            const ctx = document.getElementById('nidanaChart').getContext('2d');
            
            if (currentChartInstance) {
                currentChartInstance.destroy();
            }

            const labels = ['無明', '行', '識', '名色', '六入', '觸', '受', '愛', '取', '有', '生', '老死'];
            const dataValues = Array(12).fill(1);
            
            // 更為明亮的禪風大地色系漸層
            const bgColors = [
                '#A63A32', '#9C7E5A', '#A38865', '#AB9270', '#B39B7A', '#BB0485', 
                '#C2AE8F', '#C8B699', '#CFBFA3', '#D5C7AD', '#DBCEB7', '#2B231D'
            ];

            currentChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: bgColors,
                        borderWidth: 2,
                        borderColor: '#FFFFFF',
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '55%',
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.label + ' (點擊查看)';
                                }
                            },
                            backgroundColor: 'rgba(43, 35, 29, 0.9)',
                            titleFont: { family: "'Noto Serif TC', serif", size: 14 },
                            bodyFont: { family: "'Noto Serif TC', serif", size: 13 },
                            padding: 12,
                            displayColors: false
                        }
                    },
                    onClick: (event, elements) => {
                        const detailBox = document.getElementById('chart-detail-box');
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            detailBox.innerHTML = `<span class="text-[#A63A32] text-lg leading-loose">${nidanaDescriptions[index]}</span>`;
                            detailBox.classList.remove('bg-[#F5F4F1]', 'border-[#E8E4DB]');
                            detailBox.classList.add('bg-white', 'shadow-md', 'border-[#A63A32]');
                        } else {
                            detailBox.innerHTML = '點擊上方圖表區塊以查看節點解說';
                            detailBox.classList.remove('bg-white', 'shadow-md', 'border-[#A63A32]');
                            detailBox.classList.add('bg-[#F5F4F1]', 'border-[#E8E4DB]');
                        }
                    }
                }
            });
        }

        // 初始化應用
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
