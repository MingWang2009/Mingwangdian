    <script>
        const sutraData = [
            {
                id: 'intro',
                type: 'intro',
                title: '開始修行',
                icon: '◇',
                content: `
                    <div class="text-center mb-10">
                        <span class="text-5xl text-zen-accent block mb-6 transition-colors">☸</span>
                        <h2 class="text-3xl md:text-4xl font-bold text-zen-textHeading mb-4 tracking-[0.2em] transition-colors">歡迎來到《心經》互動解析</h2>
                        <p class="text-lg text-zen-gold tracking-widest font-light transition-colors">一處沉澱心靈的數位空間</p>
                    </div>
                    <div class="text-lg leading-loose text-zen-textMain max-w-2xl mx-auto text-justify tracking-wide transition-colors">
                        <p class="mb-6">我們將《般若波羅蜜多心經》的深奧智慧，拆解為十二堂循序漸進的課程與三篇總結。這裡的設計旨在讓您能專注於當下的每一句經文。</p>
                        <p class="mb-10">請點擊<span class="hidden md:inline">左側</span><span class="inline md:hidden text-zen-accent font-bold">上方</span>的課程選單，深入探索經文的現代語譯與修行重點。無論您是初學者或是精進的同修，皆能在此觀照內心，尋得平靜。</p>
                        <div class="flex justify-center">
                            <button onclick="loadContent('lesson-1', true)" class="bg-zen-bg px-10 py-4 rounded-sm border border-zen-border text-zen-accent font-bold tracking-widest hover:bg-zen-accent hover:text-zen-panel transition-all duration-300 shadow-sm flex items-center justify-center gap-3 w-full md:w-auto">
                                <span class="text-sm">◆</span> 點此進入第一課：觀自在菩薩
                            </button>
                        </div>
                    </div>
                `
            },
            {
                id: 'lesson-1',
                type: 'lesson',
                title: '第一課',
                icon: '▪',
                sutra: '觀自在菩薩',
                body: `
                    <p class="mb-6">一般人就解釋為觀世音菩薩，而這句真正的意思：</p>
                    <div class="bg-zen-bg p-6 rounded-sm border border-zen-border mb-8 transition-colors">
                        <ul class="space-y-4">
                            <li class="flex items-start"><b class="text-zen-gold text-xl mr-3 font-black">觀</b> <span>就是「看」的意思。</span></li>
                            <li class="flex items-start"><b class="text-zen-gold text-xl mr-3 font-black">自</b> <span>就是「自己」的意思。</span></li>
                            <li class="flex items-start"><b class="text-zen-gold text-xl mr-3 font-black">在</b> <span>就是「自在」的意思。</span></li>
                        </ul>
                    </div>
                    <p class="mb-4">所以整句就是 <b class="text-zen-accent font-bold">「觀看自己內心是否自在」</b>。要如何的自在呢？必須每日以十善業覺照自己，每個人總是觀照他人缺點，而沒有觀察是否自己錯誤。</p>
                `,
                takeawayTitle: '觀自在',
                takeawayBody: '要先修持觀自在，之後再修觀世音：觀照救拔世間苦難的聲音。<br><br><div class="flex gap-4 mt-4"><span class="bg-zen-panel px-4 py-2 rounded-sm border border-zen-border text-sm font-bold text-zen-textMain tracking-widest"><span class="text-zen-gold">觀自在 ➔</span> 自覺</span><span class="bg-zen-panel px-4 py-2 rounded-sm border border-zen-border text-sm font-bold text-zen-textMain tracking-widest"><span class="text-zen-gold">觀世音 ➔</span> 覺他</span></div>'
            },
            {
                id: 'lesson-2',

                title: '第二課',
                icon: '▪',
                sutra: '行深般若波羅蜜多時，照見五蘊皆空',

                    <ul class="list-none pl-0 mb-8 space-y-4">
                        <li class="bg-zen-bg p-4 border-l-4 border-zen-gold transition-colors"><b class="text-zen-textHeading">行深般若波羅蜜多時</b>：解釋為修行到最深妙智慧的時候。</li>
                        <li class="bg-zen-bg p-4 border-l-4 border-zen-gold transition-colors"><b class="text-zen-textHeading">照見五蘊皆空</b>：解釋為必須覺照自己內心對世間形色、感受、思想、行為、意識，這五蘊要能放下。</li>
                    </ul>
                    <p>人，在世間因<span class="text-zen-accent font-medium">形形色色人事物的干擾</span>，有了不同的感受、思想，<span class="text-zen-accent font-medium">產生偏差的行為與意念</span>，為了想擁有、過度的貪求，傷害他人而不自知，才造成種種惡業。</p>
                `,
                takeawayTitle: '要學習原諒與放下',
                takeawayBody: '要達到五蘊皆空雖然很難，但我們千萬不要因為我們的自私五蘊熾盛而傷害他人，或傷害其他有形或無形眾生。<br><br><div class="flex flex-wrap gap-4 mt-4"><span class="bg-zen-panel px-4 py-2 rounded-sm border border-zen-border text-sm font-bold"><span class="text-zen-gold">有形 ➔</span> 其他動物</span><span class="bg-zen-panel px-4 py-2 rounded-sm border border-zen-border text-sm font-bold"><span class="text-zen-gold">無形 ➔</span> 天地之間看不見的萬物</span></div>'
            },
            {
                id: 'lesson-3',
                type: 'lesson',
                title: '第三課',
                icon: '▪',
                sutra: '度一切苦厄',

                    <p class="mb-6 text-xl font-bold text-zen-accent text-center tracking-widest border-b border-zen-border pb-4 transition-colors">解釋為度化自己心中一切的煩惱苦厄。</p>
                    <p class="text-justify leading-loose">人，因為五蘊熾盛、被世界的萬物所染，金錢、權勢、名利、名牌、名車、豪宅、過度的需求，而產生慾妄貪求，而心被這些綁住了，變成了眾多的煩惱，這些煩惱憂苦我們的身心，甚至迫使我們為了想擁有而造成惡業，使我們墮落於輪迴之中。</p>
                `,
                takeawayTitle: '轉念',
                takeawayBody: '只要轉個念頭、知足常樂，只要看淡五蘊，放下五蘊，自能度化心中一切煩惱苦厄。'

            {

                icon: '▪',
                sutra: '舍利子，色不異空、空不異色',

                        <div class="absolute -right-4 -bottom-10 text-[10rem] opacity-[0.05] text-white select-none">☸</div>
                        <h4 class="text-xl font-bold text-zen-textHeaderMain mb-4 border-b border-zen-borderHeader pb-3 tracking-widest">關於涅槃</h4>
                        <p class="leading-loose text-zen-textHeaderSub text-justify">就是經過修行而減除了貪欲、瞋恨、愚癡、邪見、是非等煩惱以後，所獲得的一種圓滿光明，自由自在的寧靜心境。涅槃不是死亡，那麼多人學佛，就為了涅槃死亡，那就太沒意義了，涅槃絕對不是死亡才可證得。</p>
                    </div>
                `
            }
        ];

        // 取得當前主題 CSS 變數的方法
        const getThemeColor = (varName) => getComputedStyle(document.documentElement).getPropertyValue(varName).trim();

        // Themes palette map for Chart.js
        const chartPalettes = {
            'default': ['#A63A32', '#9C7E5A', '#A38865', '#AB9270', '#B39B7A', '#BBA485', '#C2AE8F', '#C8B699', '#CFBFA3', '#D5C7AD', '#DBCEB7', '#2B231D'],
            'cinnabar': ['#C8321F', '#C49A2A', '#C9A33B', '#CFAC4C', '#D4B55D', '#D9BD6F', '#DEC680', '#E4CF91', '#E9D8A2', '#EFE1B3', '#F4EAC4', '#1A0E08'],
            'cyan': ['#4A7B6F', '#A0845C', '#A78E6B', '#AE987A', '#B5A289', '#BCAC98', '#C3B6A7', '#CAC0B6', '#D1CAC5', '#D8D4D4', '#DFDEE3', '#1C2325'],
            'dark': ['#B83228', '#D4A93A', '#D9AF48', '#DEB556', '#E3BB64', '#E8C172', '#EDC780', '#F2CD8E', '#F7D39C', '#FCD9AA', '#FFDFB8', '#0A0604'],
            'pine': ['#3D5C4A', '#555555', '#666666', '#777777', '#888888', '#999999', '#AAAAAA', '#BBBBBB', '#CCCCCC', '#DDDDDD', '#EEEEEE', '#181818']
        };

        const nidanaDescriptions = [
            "① 無明：眾生因有無明的壞習性",
            "② 行：造了行為惡因，及不好的六識念頭",
            "③ 識：投胎於名色婆娑世界中",
            "④ 名色：在母親的肚子中",
            "⑤ 六入：眼耳鼻舌身意這六根慢慢的形成",
            "⑥ 觸：出生後接觸了這世間一切慾望",
            "⑦ 受：有了感受",
            "⑧ 愛：產生愛慾",
            "⑨ 取：想要取得，想盡辦法擁有",
            "⑩ 有：如此一直造因受果",
            "⑪ 生：輪迴出生",
            "⑫ 老死：一直老死"
        ];

        let currentChartInstance = null;
        let currentThemeId = 'default';

        // 主題管理邏輯
        function setTheme(theme) {
            currentThemeId = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('zen-theme', theme);
            
            // 重新繪製圖表以套用新顏色
            if (currentChartInstance) {
                renderChart();
            }
            toggleThemeMenu(); // 關閉選單
        }

        function toggleThemeMenu() {
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function initApp() {
            // 載入儲存的主題
            const savedTheme = localStorage.getItem('zen-theme') || 'default';
            document.documentElement.setAttribute('data-theme', savedTheme);
            currentThemeId = savedTheme;

            const navContainer = document.getElementById('lesson-nav');
            const mobileNav = document.getElementById('mobile-nav');
            
            sutraData.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'nav-item text-left px-5 py-3 rounded-sm text-zen-textMain text-sm md:text-base tracking-widest w-full flex items-center gap-3 border-transparent transition-colors';
                btn.id = `nav-${item.id}`;
                btn.onclick = () => loadContent(item.id, true);
                
                let iconStr = `<span class="text-zen-gold text-xs">${item.icon}</span>`;
                if(item.type === 'summary') iconStr = `<span class="text-zen-accent text-xs">${item.icon}</span>`;

                btn.innerHTML = `${iconStr} <span class="truncate">${item.title}</span>`;
                navContainer.appendChild(btn);

                if (mobileNav) {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = `${item.icon} ${item.title}`;
                    mobileNav.appendChild(option);
                }
            });

            loadContent('intro');
        }

        function loadContent(id, shouldScroll = false) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('nav-item-active'));
            const activeBtn = document.getElementById(`nav-${id}`);
            if(activeBtn) activeBtn.classList.add('nav-item-active');

            const mobileNav = document.getElementById('mobile-nav');
            if(mobileNav) mobileNav.value = id;

            const data = sutraData.find(item => item.id === id);
            if (!data) return;

            const container = document.getElementById('content-display');
            container.classList.remove('fade-in');
            void container.offsetWidth; 
            
            let htmlContent = '';

            if (data.type === 'intro') {
                htmlContent = data.content;
            } else {
                htmlContent = `
                    <div class="mb-5 text-zen-gold tracking-[0.2em] text-sm font-bold flex items-center gap-3 transition-colors">
                        <span class="w-6 h-[1px] bg-zen-gold"></span> ${data.title}
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold text-zen-accent mb-10 pb-6 border-b border-zen-border tracking-widest leading-loose text-center transition-colors">
                        「${data.sutra}」
                    </h2>
                    <div class="mb-10 text-zen-textMain transition-colors">
                        ${data.body}
                    </div>
                `;

                if (data.takeawayTitle) {
                    htmlContent += `
                        <div class="mt-12 bg-zen-bg p-8 rounded-sm border-l-4 border-zen-accent transition-colors">
                            <h3 class="text-lg font-bold text-zen-textHeading mb-4 tracking-widest">進入佛門${data.title}：<span class="text-zen-accent">【${data.takeawayTitle}】</span></h3>
                            <p class="text-zen-textMain leading-loose text-justify">${data.takeawayBody}</p>
                        </div>
                    `;
                }

                const currentIndex = sutraData.findIndex(item => item.id === id);
                let bottomNavHtml = '<div class="flex flex-col md:flex-row justify-between items-center mt-12 pt-8 border-t border-zen-border gap-4 transition-colors">';

                if (currentIndex > 0) {
                    const prevItem = sutraData[currentIndex - 1];
                    bottomNavHtml += `<button onclick="loadContent('${prevItem.id}', true)" class="w-full md:w-auto text-center md:text-left px-6 py-3 rounded-sm border border-zen-border bg-zen-bg text-zen-textMain hover:bg-zen-panel hover:border-zen-accent hover:text-zen-accent transition-all shadow-sm tracking-widest"><span class="text-[10px] mr-2 text-zen-gold">▲</span>上一單元：${prevItem.title}</button>`;
                } else {
                    bottomNavHtml += `<div class="hidden md:block w-full md:w-auto"></div>`; 
                }

                if (currentIndex < sutraData.length - 1) {
                    const nextItem = sutraData[currentIndex + 1];
                    bottomNavHtml += `<button onclick="loadContent('${nextItem.id}', true)" class="w-full md:w-auto text-center md:text-right px-6 py-3 rounded-sm border border-zen-border bg-zen-bg text-zen-textMain hover:bg-zen-panel hover:border-zen-accent hover:text-zen-accent transition-all shadow-sm tracking-widest">下一單元：${nextItem.title}<span class="text-[10px] ml-2 text-zen-gold">▼</span></button>`;
                } else {
                    bottomNavHtml += `<div class="hidden md:block w-full md:w-auto"></div>`;
                }
                
                bottomNavHtml += '</div>';
                htmlContent += bottomNavHtml;
            }

            container.innerHTML = htmlContent;
            container.classList.add('fade-in');

            if (data.hasChart) {
                setTimeout(renderChart, 100);
            } else if (currentChartInstance) {
                currentChartInstance.destroy();
                currentChartInstance = null;
            }

            if (shouldScroll) {
                setTimeout(() => {
                    const yOffset = window.innerWidth < 768 ? -100 : -40; 
                    const y = container.getBoundingClientRect().top + window.scrollY + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }, 150);
            }
        }

        // Custom Interaction for Lesson 9 
        function highlightDust(rootId) {
            document.querySelectorAll('.dust-item').forEach(el => {
                el.className = 'dust-item bg-zen-panel p-4 rounded-sm border border-transparent text-zen-muted transition-all flex items-center h-full';
            });
            document.querySelectorAll('.root-btn').forEach(el => {
                el.className = 'root-btn interactive-card bg-zen-sub p-4 rounded-sm border border-zen-border text-left hover:border-zen-accent text-zen-textMain font-bold';
            });

            event.currentTarget.classList.add('border-zen-accent', 'bg-zen-panel');
            event.currentTarget.classList.remove('border-zen-border', 'bg-zen-sub');

            const targetDust = document.getElementById(`dust-${rootId}`);
            if (targetDust) {
                targetDust.className = 'dust-item bg-zen-header p-4 rounded-sm border border-zen-borderHeader text-zen-textHeaderMain transition-all flex items-center h-full shadow-md';
            }
        }

        // Chart.js Rendering for Lesson 10 
        function renderChart() {
            const ctx = document.getElementById('nidanaChart').getContext('2d');
            
            if (currentChartInstance) {
                currentChartInstance.destroy();
            }

            const labels = ['無明', '行', '識', '名色', '六入', '觸', '受', '愛', '取', '有', '生', '老死'];
            const dataValues = Array(12).fill(1);
            
            const bgColors = chartPalettes[currentThemeId] || chartPalettes['default'];

            currentChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: bgColors,
                        borderWidth: 2,
                        borderColor: getThemeColor('--bg-panel'),
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '55%',
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.label + ' (點擊查看)';
                                }
                            },
                            backgroundColor: getThemeColor('--bg-headerBox'),
                            titleFont: { family: "'Noto Serif TC', serif", size: 14 },
                            bodyFont: { family: "'Noto Serif TC', serif", size: 13 },
                            titleColor: getThemeColor('--text-header-main'),
                            bodyColor: getThemeColor('--text-header-main'),
                            padding: 12,
                            displayColors: false
                        }
                    },
                    onClick: (event, elements) => {
                        const detailBox = document.getElementById('chart-detail-box');
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            detailBox.innerHTML = `<span class="text-zen-accent text-lg leading-loose">${nidanaDescriptions[index]}</span>`;
                            detailBox.className = 'mt-8 p-5 bg-zen-panel rounded-sm border border-zen-accent shadow-md text-center min-h-[5rem] flex items-center justify-center font-bold transition-all tracking-widest text-zen-textMain';
                        } else {
                            detailBox.innerHTML = '點擊上方圖表區塊以查看節點解說';
                            detailBox.className = 'mt-8 p-5 bg-zen-bg rounded-sm border border-zen-border text-center min-h-[5rem] flex items-center justify-center font-bold transition-all tracking-widest text-zen-textMain';
                        }
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
