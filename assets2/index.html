        }
        .nav-item {

        .nav-item::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;

                        <p class="mb-6">我們將東密明王殿釋明法師父之《般若波羅蜜多心經》淺譯，拆解為十二堂循序漸進的課程與六篇總結。這裡的設計旨在讓您能專注於當下的每一句經文。</p>

        // --- Ink Particles Animation (Canvas) ---
        function initInkParticles() {
            const canvas = document.getElementById('ink-particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const particleCount = 55;

            function resize() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.3; 
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.radius = Math.random() * 2 + 0.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                    if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = getThemeColor('--color-gold'); 
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = getThemeColor('--color-gold');
                            ctx.globalAlpha = 1 - (dist / 100);
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                            ctx.globalAlpha = 1; 
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

                    setTimeout(renderChart, 100);
                } else if (currentChartInstance) {
                    currentChartInstance.destroy();
                    currentChartInstance = null;
                }

                if (shouldScroll) {
                    const yOffset = window.innerWidth < 768 ? -100 : -40; 
                    const y = container.getBoundingClientRect().top + window.scrollY + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }

                isTransitioning = false;
            }, 300);
        }

        // --- Lesson 9 Specific Interaction ---
        function highlightDust(rootId, event) {
            document.querySelectorAll('.dust-item').forEach(el => {
                el.className = 'dust-item bg-zen-panel p-4 rounded-sm border border-transparent text-zen-muted transition-all flex items-center h-full';
            });
            document.querySelectorAll('.root-btn').forEach(el => {
                el.className = 'ripple-btn root-btn interactive-card bg-zen-sub p-4 rounded-sm border border-zen-border text-left hover:border-zen-accent text-zen-textMain font-bold';
            });

            event.currentTarget.classList.add('border-zen-accent', 'bg-zen-panel');
            event.currentTarget.classList.remove('border-zen-border', 'bg-zen-sub');

            const targetDust = document.getElementById(`dust-${rootId}`);
            if (targetDust) {
                targetDust.className = 'dust-item bg-zen-header p-4 rounded-sm border border-zen-borderHeader text-zen-textHeaderMain transition-all flex items-center h-full shadow-md';
            }
        }

        // --- Lesson 10 Chart.js ---
        function renderChart() {
            const ctx = document.getElementById('nidanaChart').getContext('2d');
            if (currentChartInstance) currentChartInstance.destroy();

            const labels = ['無明', '行', '識', '名色', '六入', '觸', '受', '愛', '取', '有', '生', '老死'];
            const dataValues = Array(12).fill(1);
            const bgColors = chartPalettes[currentThemeId] || chartPalettes['default'];

            currentChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues, backgroundColor: bgColors,
                        borderWidth: 2, borderColor: getThemeColor('--bg-panel'), hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '55%',
                    animation: { animateScale: true, animateRotate: true },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: { label: function(context) { return ' ' + context.label + ' (點擊查看)'; } },
                            backgroundColor: getThemeColor('--bg-headerBox'),
                            titleFont: { family: "'Noto Serif TC', serif", size: 14 },
                            bodyFont: { family: "'Noto Serif TC', serif", size: 13 },
                            titleColor: getThemeColor('--text-header-main'),
                            bodyColor: getThemeColor('--text-header-main'),
                            padding: 12, displayColors: false
                        }
                    },
                    onClick: (event, elements) => {
                        const detailBox = document.getElementById('chart-detail-box');
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            detailBox.innerHTML = `<span class="text-zen-accent text-lg leading-loose">${nidanaDescriptions[index]}</span>`;
                            detailBox.className = 'mt-8 p-5 bg-zen-panel rounded-sm border border-zen-accent shadow-md text-center min-h-[5rem] flex items-center justify-center font-bold transition-all tracking-widest text-zen-textMain';
                        } else {
                            detailBox.innerHTML = '點擊上方圖表區塊以查看節點解說';
                            detailBox.className = 'mt-8 p-5 bg-zen-bg rounded-sm border border-zen-border text-center min-h-[5rem] flex items-center justify-center font-bold transition-all tracking-widest text-zen-textMain';
                        }
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
