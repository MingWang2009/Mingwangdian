<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>藥師琉璃光如來十二大願｜東方淨琉璃世界 3D 曼荼羅壇城</title>
	<meta property="og:type" content="website">
	<meta property="og:title" content="藥師琉璃光如來十二大願">
	<meta property="og:description" content="東方淨琉璃世界・3D曼荼羅壇城・十二大願琉璃心燈">
	<meta property="og:image" content="https://mingwang2009.github.io/Mingwangdian/assets6/medicine_buddha_twelve_vows_3.png">
	<meta name="twitter:card" content="summary_large_image">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Inter"', '"PingFang TC"', '"Microsoft JhengHei"', 'sans-serif'],
                    },
                    colors: {
                        lapis: {
                            950: '#020710',
                            900: '#061224',
                            800: '#0b213f',
                            700: '#133663',
                            600: '#1d4f8f',
                        },
                        cyanGlow: {
                            300: '#67e8f9',
                            400: '#00e5ff',
                            500: '#06b6d4',
                        },
                        gold: {
                            200: '#fef08a',
                            300: '#fde047',
                            400: '#ffd700',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020710;
            font-family: 'Noto Serif TC', serif;
            color: #f8fafc;
        }

        /* 3D 畫布全螢幕容器 */
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 50% 35%, #0c264a 0%, #051022 55%, #02060d 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* 3D 蓮花燈上方投影 HTML 懸浮標籤 */
        #labels-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .vow-3d-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            white-space: nowrap;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .vow-3d-label:hover {
            transform: translate(-50%, -108%) scale(1.08);
            z-index: 30 !important;
        }

        .vow-3d-label.lit {
            background: linear-gradient(135deg, rgba(45, 35, 10, 0.88), rgba(15, 38, 68, 0.9));
            border-color: #ffd700;
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.5);
        }

        .vow-3d-label.active-vow {
            border-color: #00e5ff;
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.8), 0 0 40px rgba(255, 215, 0, 0.5);
            transform: translate(-50%, -112%) scale(1.12);
        }

        /* 毛玻璃面板通用樣式 */
        .glass-panel {
            background: linear-gradient(155deg, rgba(8, 24, 48, 0.82) 0%, rgba(3, 11, 24, 0.90) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.28);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.12);
        }

        .glass-panel-gold {
            background: linear-gradient(155deg, rgba(14, 34, 64, 0.88) 0%, rgba(24, 20, 8, 0.92) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 215, 0, 0.55);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 215, 0, 0.18);
        }

        /* 難字注音樣式 */
        .ruby-term {
            border-bottom: 1px dashed #ffd700;
            color: #fef08a;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 3px;
            transition: background-color 0.2s;
            user-select: text;
            -webkit-user-select: text;
        }

        .ruby-term:hover {
            background-color: rgba(255, 215, 0, 0.22);
        }

        .selectable-text {
            user-select: text;
            -webkit-user-select: text;
        }

        /* 古典四角飾紋 */
        .corner-deco {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: rgba(255, 215, 0, 0.65);
            pointer-events: none;
        }
        .c-tl { top: 6px; left: 6px; border-top: 2px solid; border-left: 2px solid; border-top-left-radius: 4px; }
        .c-tr { top: 6px; right: 6px; border-top: 2px solid; border-right: 2px solid; border-top-right-radius: 4px; }
        .c-bl { bottom: 6px; left: 6px; border-bottom: 2px solid; border-left: 2px solid; border-bottom-left-radius: 4px; }
        .c-br { bottom: 6px; right: 6px; border-bottom: 2px solid; border-right: 2px solid; border-bottom-right-radius: 4px; }

        /* 自訂捲軸 */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(2, 7, 16, 0.4);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(0, 229, 255, 0.35);
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.7);
        }
    </style>
</head>
<body>

    <!-- 1. Three.js 3D 東方淨琉璃世界場景容器 -->
    <div id="canvas-container"></div>

    <!-- 2. 3D 蓮花經幢懸浮標籤投影層 -->
    <div id="labels-container"></div>

    <!-- 3. 頂部導覽與視角/模式控制列 (HUD Top Bar) -->
    <header class="fixed top-0 left-0 right-0 z-30 pointer-events-none p-2.5 sm:p-4">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2.5">
            
            <!-- 左側：標題與點燈進度 -->
            <div class="glass-panel rounded-2xl px-3.5 py-2.5 flex items-center justify-between sm:justify-start gap-3 pointer-events-auto">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-cyanGlow-400 via-blue-600 to-lapis-900 flex items-center justify-center border border-gold-400 shadow-[0_0_15px_rgba(0,229,255,0.5)] shrink-0">
                        <span class="text-gold-300 font-black text-base">琉</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="text-sm sm:text-base font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-gold-200 via-gold-400 to-cyanGlow-300">
                                藥師琉璃光如來十二大願
                            </h1>
                            <span class="hidden sm:inline-block text-[10px] font-sans px-2 py-0.5 rounded-full bg-cyanGlow-400/15 text-cyanGlow-300 border border-cyanGlow-400/30">
                                3D 曼荼羅壇城
                            </span>
                        </div>
                        <p class="text-[11px] text-slate-300 font-sans">
                            拖曳旋轉 360° 壇城・點擊蓮燈飛躍賞析・點亮十二心燈連結琉璃摩尼寶珠
                        </p>
                    </div>
                </div>

                <!-- 點燈進度膠囊 -->
                <div class="flex items-center gap-2 pl-2 sm:pl-3 border-l border-slate-700/70 shrink-0">
                    <div class="text-right">
                        <div class="text-[10px] text-slate-400 font-sans">琉璃心燈</div>
                        <div id="hud-lit-count" class="text-xs sm:text-sm font-bold text-gold-400 font-sans">0 / 12 盞</div>
                    </div>
                    <button onclick="openDedicationModal()" class="px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-gold-500 to-amber-400 text-lapis-950 font-bold text-xs shadow-md shadow-gold-400/20 hover:brightness-110 transition active:scale-95">
                        🙏 迴向卡
                    </button>
                </div>
            </div>

            <!-- 右側：四大視角與互動模式切換按鈕列 -->
            <div class="glass-panel rounded-2xl p-1.5 flex items-center gap-1.5 overflow-x-auto custom-scroll pointer-events-auto font-sans">
                <button id="btn-mode-overview" onclick="setCameraOverview()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-cyanGlow-400/20 text-cyanGlow-300 border border-cyanGlow-400/40 hover:bg-cyanGlow-400/30 transition whitespace-nowrap flex items-center gap-1">
                    <span>🌌</span><span>壇城全景視角</span>
                </button>
                <button id="btn-mode-tour" onclick="togglePilgrimageTour()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-lapis-800/80 text-slate-200 border border-slate-700 hover:border-gold-400/50 transition whitespace-nowrap flex items-center gap-1">
                    <span id="tour-icon">🔭</span><span id="tour-text">逐願巡禮模式</span>
                </button>
                <button onclick="igniteAllLanterns()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-500/25 to-gold-400/25 text-gold-300 border border-gold-400/50 hover:bg-gold-400/30 transition whitespace-nowrap flex items-center gap-1">
                    <span>✨</span><span>一鍵點亮琉璃光海</span>
                </button>
                <button onclick="drawLuckyVow3D()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-lapis-800/80 text-cyanGlow-300 border border-cyanGlow-400/30 hover:border-cyanGlow-400 transition whitespace-nowrap flex items-center gap-1">
                    <span>🎲</span><span>抽取今日相應大願</span>
                </button>
                <button id="btn-orbit-toggle" onclick="toggleAutoOrbit()" class="px-2.5 py-1.5 rounded-xl text-xs bg-lapis-800/80 text-gold-200 border border-slate-700 hover:border-gold-400/40 transition whitespace-nowrap" title="開關蓮燈自動公轉">
                    🔄 公轉中
                </button>
                <button id="btn-audio-toggle" onclick="toggleAudioMute()" class="px-2.5 py-1.5 rounded-xl text-xs bg-lapis-800/80 text-slate-200 border border-slate-700 hover:border-cyanGlow-400/40 transition whitespace-nowrap" title="開關 3D 頌缽與引磬音效">
                    🔔 音效開
                </button>
            </div>
        </div>

        <!-- 第二排：四大悲願分類篩選列 (點擊可高亮 3D 場景對應蓮燈) -->
        <div class="max-w-7xl mx-auto mt-2 flex items-center justify-between gap-2 pointer-events-none">
            <div class="glass-panel rounded-full px-2 py-1 flex items-center gap-1 overflow-x-auto custom-scroll pointer-events-auto font-sans">
                <span class="text-[11px] text-slate-400 px-2 hidden sm:inline">悲願分類高亮：</span>
                <button onclick="filterCategory('all', this)" class="cat-btn px-2.5 py-1 rounded-full text-xs font-semibold bg-gold-400 text-lapis-950 transition whitespace-nowrap">
                    全部十二願 (12)
                </button>
                <button onclick="filterCategory('light', this)" class="cat-btn px-2.5 py-1 rounded-full text-xs text-slate-200 hover:text-gold-300 transition whitespace-nowrap">
                    ✨ 光明莊嚴 (1-2)
                </button>
                <button onclick="filterCategory('abundance', this)" class="cat-btn px-2.5 py-1 rounded-full text-xs text-slate-200 hover:text-gold-300 transition whitespace-nowrap">
                    🌾 資生無缺 (3,11-12)
                </button>
                <button onclick="filterCategory('healing', this)" class="cat-btn px-2.5 py-1 rounded-full text-xs text-slate-200 hover:text-gold-300 transition whitespace-nowrap">
                    🌿 身心療癒 (6-8,10)
                </button>
                <button onclick="filterCategory('wisdom', this)" class="cat-btn px-2.5 py-1 rounded-full text-xs text-slate-200 hover:text-gold-300 transition whitespace-nowrap">
                    ☸️ 正見戒行 (4-5,9)
                </button>
            </div>

            <!-- 敲擊頌缽靜心按鈕 -->
            <button onclick="strikeMeditationBowl()" class="glass-panel px-3 py-1.5 rounded-full text-xs text-gold-300 hover:border-gold-400 pointer-events-auto transition flex items-center gap-1.5 shrink-0 active:scale-95">
                <span>🥣</span>
                <span class="hidden sm:inline">敲擊琉璃頌缽</span>
                <span id="bowl-counter" class="px-1.5 py-0.2 bg-gold-400/20 rounded-full text-[10px] font-sans">0</span>
            </button>
        </div>
    </header>

    <!-- 4. 右側/底部毛玻璃「大願經文與修持詳情面板」 (點擊任一 3D 蓮燈時滑出) -->
    <aside id="vow-detail-drawer" class="fixed z-30 right-3 sm:right-5 top-28 sm:top-32 bottom-20 sm:bottom-24 w-[calc(100vw-1.5rem)] sm:w-[430px] glass-panel-gold rounded-2xl p-5 flex flex-col justify-between transition-all duration-500 translate-x-[120%] opacity-0 pointer-events-none">
        <div class="corner-deco c-tl"></div>
        <div class="corner-deco c-tr"></div>
        <div class="corner-deco c-bl"></div>
        <div class="corner-deco c-br"></div>

        <!-- 面板頂部：願序、分類標籤與關閉按鈕 -->
        <div class="flex items-start justify-between gap-2 border-b border-gold-400/25 pb-3 shrink-0">
            <div>
                <div class="flex items-center gap-2 mb-1 font-sans">
                    <span id="panel-cat-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-cyanGlow-400/20 text-cyanGlow-300 border border-cyanGlow-400/40">
                        ✨ 光明莊嚴
                    </span>
                    <span id="panel-lit-status" class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-800 text-slate-300">
                        🕯️ 尚未點燈
                    </span>
                </div>
                <h2 id="panel-vow-title" class="text-xl sm:text-2xl font-black text-gold-300 tracking-wide">
                    第一大願・生佛平等願
                </h2>
            </div>
            <button onclick="setCameraOverview()" class="w-8 h-8 rounded-full bg-lapis-900/80 hover:bg-lapis-700 text-slate-300 hover:text-white flex items-center justify-center border border-slate-700 transition text-lg leading-none" title="返回壇城全景">
                &times;
            </button>
        </div>

        <!-- 面板中段：可捲動經文原文、難字讀音提示、白話深意與生活修持 -->
        <div class="my-3 overflow-y-auto custom-scroll pr-1.5 space-y-4 flex-1 selectable-text">
            <!-- 經文原文框 -->
            <div class="bg-lapis-950/85 border border-cyanGlow-400/35 rounded-xl p-4 shadow-inner">
                <div class="flex items-center justify-between text-xs text-cyanGlow-300/90 mb-2 font-sans">
                    <span>📜 《藥師琉璃光如來本願功德經》玄奘大師譯本</span>
                    <span class="text-[11px] text-gold-300">點擊黃線字看讀音</span>
                </div>
                <p id="panel-vow-original" class="text-base sm:text-[17px] text-slate-100 leading-relaxed tracking-wide text-justify font-medium"></p>
                <!-- 難字點擊即時解釋列 -->
                <div id="pronunciation-helper-box" class="hidden mt-3 pt-2.5 border-t border-gold-400/25 text-xs text-gold-200 font-sans"></div>
            </div>

            <!-- 白話深意 -->
            <div class="bg-lapis-900/60 border-l-4 border-gold-400 rounded-r-xl p-3.5 text-sm">
                <div class="text-gold-300 font-bold mb-1 flex items-center gap-1.5">
                    <span>🪷</span><span>白話深意解析</span>
                </div>
                <p id="panel-vow-meaning" class="text-slate-200 leading-relaxed text-justify"></p>
            </div>

            <!-- 現代生活修持啟示 -->
            <div class="bg-lapis-900/60 border-l-4 border-cyanGlow-400 rounded-r-xl p-3.5 text-sm">
                <div class="text-cyanGlow-300 font-bold mb-1 flex items-center gap-1.5">
                    <span>🌿</span><span>現代生活修持啟示</span>
                </div>
                <p id="panel-vow-practice" class="text-cyanGlow-300/95 leading-relaxed text-justify"></p>
            </div>
        </div>

        <!-- 面板底部：點亮 3D 琉璃燈、語音恭誦與前後願切換 -->
        <div class="pt-3 border-t border-gold-400/25 space-y-2.5 shrink-0 font-sans">
            <div class="flex items-center gap-2">
                <button id="panel-btn-light" onclick="toggleCurrentVowLight()" class="flex-1 py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5 shadow-lg active:scale-95 bg-gradient-to-r from-gold-500 to-amber-400 text-lapis-950">
                    <span>🕯️</span><span id="panel-btn-light-text">點亮此願 3D 琉璃燈</span>
                </button>
                <button id="panel-btn-speak" onclick="speakCurrentVow()" class="py-2.5 px-3.5 rounded-xl bg-lapis-800 hover:bg-lapis-700 border border-cyanGlow-400/40 text-cyanGlow-300 text-xs sm:text-sm font-medium transition flex items-center gap-1 active:scale-95">
                    <span id="panel-speak-icon">🔊</span><span id="panel-speak-text">恭誦</span>
                </button>
            </div>

            <div class="flex items-center justify-between gap-2 text-xs">
                <button onclick="navigateVow(-1)" class="flex-1 py-1.5 px-3 rounded-lg bg-lapis-900/90 hover:bg-lapis-800 border border-slate-700 text-slate-300 transition">
                    ◀ 上一大願
                </button>
                <button onclick="setCameraOverview()" class="py-1.5 px-3 rounded-lg bg-lapis-900/90 hover:bg-lapis-800 border border-slate-700 text-gold-300 transition">
                    🌌 全景
                </button>
                <button onclick="navigateVow(1)" class="flex-1 py-1.5 px-3 rounded-lg bg-lapis-900/90 hover:bg-lapis-800 border border-slate-700 text-slate-300 transition">
                    下一大願 ▶
                </button>
            </div>
        </div>
    </aside>

    <!-- 5. 底部十二大願快速導覽輪盤列 (Bottom Dock) -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 p-2.5 sm:p-3.5 pointer-events-none">
        <div class="max-w-6xl mx-auto">
            <div id="bottom-vows-dock" class="glass-panel rounded-2xl p-2 flex items-center gap-1.5 sm:gap-2 overflow-x-auto custom-scroll pointer-events-auto">
                <!-- 由 JS 動態生成 1 ~ 12 大願蓮花燈快捷按鈕 -->
            </div>
        </div>
    </footer>

    <!-- 6. 圓滿點亮十二願 3D 琉璃光海慶祝浮動橫幅 -->
    <div id="grand-completion-banner" class="fixed top-28 left-1/2 -translate-x-1/2 z-40 hidden pointer-events-auto">
        <div class="glass-panel-gold rounded-full px-5 py-2.5 flex items-center gap-3 shadow-[0_0_40px_rgba(255,215,0,0.6)] animate-bounce">
            <span class="text-xl">🌟</span>
            <div class="text-xs sm:text-sm">
                <span class="text-gold-300 font-bold">十二大願琉璃光海大圓滿！</span>
                <span class="text-slate-200 hidden sm:inline">十二道金色能量光束已匯聚中央摩尼寶珠</span>
            </div>
            <button onclick="openDedicationModal()" class="px-3 py-1 rounded-full bg-gold-400 text-lapis-950 font-bold text-xs hover:brightness-110 transition">
                擷取 3D 壇城迴向卡
            </button>
            <button onclick="document.getElementById('grand-completion-banner').classList.add('hidden')" class="text-slate-400 hover:text-white text-sm px-1">&times;</button>
        </div>
    </div>

    <!-- 7. 彈窗：匯出 3D 琉璃祈福迴向卡 Modal -->
    <div id="dedication-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-6 overflow-y-auto" onclick="closeDedicationModal()">
        <div class="relative w-full max-w-2xl glass-panel-gold rounded-2xl p-5 sm:p-7 my-auto" onclick="event.stopPropagation()">
            <div class="corner-deco c-tl"></div>
            <div class="corner-deco c-tr"></div>
            <div class="corner-deco c-bl"></div>
            <div class="corner-deco c-br"></div>

            <div class="flex items-center justify-between border-b border-gold-400/25 pb-3.5 mb-4">
                <div>
                    <h3 class="text-lg sm:text-2xl font-black text-gold-300 flex items-center gap-2">
                        <span>🙏</span><span>3D 東方淨琉璃世界・祈福迴向卡</span>
                    </h3>
                    <p class="text-xs text-slate-300 font-sans mt-0.5">
                        即時擷取您當前的 3D 琉璃壇城畫面，結合祈福姓名與願文合成高解析度 PNG 祈福卡
                    </p>
                </div>

            if (!audioCtx) {

                if (AudioContextClass) audioCtx = new AudioContextClass();

            return audioCtx;

        // 合成清淨琉璃頌缽與引磬泛音
        function playSingingBowl(baseFreq = 432, duration = 3.2, pan = 0) {
            if (isAudioMuted) return;
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;

                const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
                if (panner) {
                    panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), now);
                    panner.connect(ctx.destination);
                }

                const partials = [
                    { ratio: 1.0, gain: 0.24, decay: duration },
                    { ratio: 2.756, gain: 0.12, decay: duration * 0.72 },
                    { ratio: 5.404, gain: 0.05, decay: duration * 0.45 }
                ];

                partials.forEach(p => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFreq * p.ratio, now);

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.exponentialRampToValueAtTime(p.gain, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

                    osc.connect(gain);
                    if (panner) gain.connect(panner);
                    else gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + p.decay + 0.05);
                });
            } catch (e) {}
        }

            const btn = document.getElementById('btn-audio-toggle');
            btn.innerText = isAudioMuted ? '🔇 音效關' : '🔔 音效開';
            if (!isAudioMuted) playSingingBowl(528, 2.0);
        }

        /* =========================================================================
         * 叁、Three.js 3D 東方淨琉璃世界場景建構
         * ========================================================================= */
        let scene, camera, renderer, raycaster, mouse;
        let centralJewelGroup, centralCoreMesh, centralOuterShell, lotusThroneGroup;
        let haloRings = [];
        let mandalaOrbitGroup; // 承載 12 座琉璃蓮花經幢與光束的公轉群組
        let lanternObjects = []; // 儲存 12 座 3D 蓮燈的細節引用
        let particleSystem, completionRainSystem;
        let shockwaves = [];
        let spinBoostSpeed = 0; // 抽籤時的加速旋轉速度

        // 鏡頭平滑控制狀態 (Spherical Orbit + Smooth Target Lerp)
        const camState = {
            mode: 'overview', // 'overview' | 'focus'
            sphericalRadius: 27,
            targetRadius: 27,
            polarAngle: 1.05,      // 俯仰角
            targetPolar: 1.05,
            azimuthAngle: 0.0,     // 水平旋轉角
            targetAzimuth: 0.0,
            currentPos: new THREE.Vector3(0, 14, 24),
            targetPos: new THREE.Vector3(0, 14, 24),
            lookAtCurrent: new THREE.Vector3(0, 0.5, 0),
            lookAtTarget: new THREE.Vector3(0, 0.5, 0),
            isDragging: false,
            prevMouse: { x: 0, y: 0 },
            dragMoved: false
        };

        // 產生柔和發光粒子貼圖 (Procedural Canvas Texture)
        function createGlowTexture(colorCenter = '#ffffff', colorMid = '#00e5ff') {
            const c = document.createElement('canvas');
            c.width = 64;
            c.height = 64;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
            grad.addColorStop(0, colorCenter);
            grad.addColorStop(0.35, colorMid);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }

        function init3DScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030b18, 0.014);

            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.copy(camState.currentPos);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                preserveDrawingBuffer: true // 允許擷取 3D 畫面合成祈福迴向卡
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 燈光配置
            const ambientLight = new THREE.AmbientLight(0x1e4d8c, 1.35);
            scene.add(ambientLight);

            const centerPointLight = new THREE.PointLight(0x00e5ff, 2.4, 45);
            centerPointLight.position.set(0, 2.5, 0);
            scene.add(centerPointLight);

            const goldTopLight = new THREE.DirectionalLight(0xffd700, 1.25);
            goldTopLight.position.set(10, 25, 12);
            scene.add(goldTopLight);

            const bottomRimLight = new THREE.DirectionalLight(0x00b4d8, 0.8);
            bottomRimLight.position.set(-10, -15, -10);
            scene.add(bottomRimLight);

            // 1. 建立中央主尊象徵：琉璃摩尼寶珠與千葉蓮花寶座
            buildCentralManiJewelAndLotus();

            // 2. 建立地面曼荼羅神聖幾何光陣
            buildMandalaFloorGrid();

            // 3. 建立十二大願 3D 琉璃蓮花經幢與光束系統
            buildTwelveVowLanterns();

            // 4. 建立 3D 琉璃光點粒子星雲與圓滿金雨粒子
            buildParticleNebula();

            // 5. 綁定滑鼠與觸控 3D 互動事件
            bindInteractionEvents(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        // 建立中央「琉璃摩尼寶珠」與「立體千葉蓮花寶座」
        function buildCentralManiJewelAndLotus() {
            centralJewelGroup = new THREE.Group();
            scene.add(centralJewelGroup);

            // (A) 內部黃金熾然核心
            const innerGeo = new THREE.OctahedronGeometry(1.35, 2);
            const innerMat = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                wireframe: true,
                transparent: true,
                opacity: 0.65
            });
            centralCoreMesh = new THREE.Mesh(innerGeo, innerMat);
            centralCoreMesh.position.y = 1.6;
            centralJewelGroup.add(centralCoreMesh);

            // 核心發光球
            const coreGlowGeo = new THREE.SphereGeometry(1.1, 32, 32);
            const coreGlowMat = new THREE.MeshBasicMaterial({
                color: 0x00e5ff,
                transparent: true,
                opacity: 0.85
            });
            const coreGlowSphere = new THREE.Mesh(coreGlowGeo, coreGlowMat);
            coreGlowSphere.position.y = 1.6;
            centralJewelGroup.add(coreGlowSphere);
            centralJewelGroup.userData.coreGlowSphere = coreGlowSphere;

            // (B) 外層晶瑩琉璃摩尼寶珠殼 (身如琉璃，內外明徹)
            const shellGeo = new THREE.IcosahedronGeometry(2.15, 3);
            const shellMat = new THREE.MeshPhongMaterial({
                color: 0x0a4d8c,
                emissive: 0x052c52,
                specular: 0xffffff,
                shininess: 120,
                transparent: true,
                opacity: 0.62,
                flatShading: true
            });
            centralOuterShell = new THREE.Mesh(shellGeo, shellMat);
            centralOuterShell.position.y = 1.6;
            centralJewelGroup.add(centralOuterShell);

            // 摩尼寶珠頂端黃金寶頂 (寶瓶塔剎意象)
            const spireGeo = new THREE.ConeGeometry(0.45, 1.3, 8);
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0x553800,
                metalness: 0.8,
                roughness: 0.2
            });
            const spire = new THREE.Mesh(spireGeo, goldMat);
            spire.position.y = 4.15;
            centralJewelGroup.add(spire);

            // (C) 立體多層千葉蓮花寶座 (3 層環狀立體蓮瓣)
            lotusThroneGroup = new THREE.Group();
            lotusThroneGroup.position.y = -0.7;
            centralJewelGroup.add(lotusThroneGroup);

            const layers = [
                { count: 12, radius: 2.2, scaleY: 1.3, tilt: 0.48, yOffset: 0.4, color: 0xffd700 },
                { count: 16, radius: 2.8, scaleY: 1.15, tilt: 0.82, yOffset: 0.0, color: 0x00e5ff },
                { count: 20, radius: 3.4, scaleY: 1.0, tilt: 1.15, yOffset: -0.35, color: 0x1e4d8c }
            ];

            const petalGeo = new THREE.ConeGeometry(0.58, 1.65, 5);
            petalGeo.scale(1, 1, 0.32);

            layers.forEach(layer => {
                const mat = new THREE.MeshStandardMaterial({
                    color: layer.color,
                    emissive: layer.color === 0xffd700 ? 0x442b00 : 0x042440,
                    metalness: 0.65,
                    roughness: 0.28
                });
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * Math.PI * 2;
                    const petal = new THREE.Mesh(petalGeo, mat);
                    petal.position.set(
                        Math.cos(angle) * layer.radius,
                        layer.yOffset,
                        Math.sin(angle) * layer.radius
                    );
                    petal.rotation.y = -angle + Math.PI / 2;
                    petal.rotation.x = layer.tilt;
                    petal.scale.y = layer.scaleY;
                    lotusThroneGroup.add(petal);
                }
            });

            // 蓮座底部黃金須彌座圓盤
            const baseGeo = new THREE.CylinderGeometry(3.5, 4.1, 0.55, 24);
            const baseMesh = new THREE.Mesh(baseGeo, goldMat);
            baseMesh.position.y = -0.8;
            lotusThroneGroup.add(baseMesh);

            // (D) 外圍立體旋轉金色背光光環 (Halo Rings)
            const ringConfigs = [
                { r: 3.3, tube: 0.045, color: 0xffd700, rotX: 0.35, rotY: 0.2 },
                { r: 4.0, tube: 0.035, color: 0x00e5ff, rotX: -0.45, rotY: 0.5 },
                { r: 4.7, tube: 0.03, color: 0xfde047, rotX: 1.2, rotY: -0.3 }
            ];

            ringConfigs.forEach(cfg => {
                const rGeo = new THREE.TorusGeometry(cfg.r, cfg.tube, 12, 64);
                const rMat = new THREE.MeshBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: 0.72
                });
                const rMesh = new THREE.Mesh(rGeo, rMat);
                rMesh.position.y = 1.6;
                rMesh.rotation.set(cfg.rotX, cfg.rotY, 0);
                centralJewelGroup.add(rMesh);
                haloRings.push(rMesh);
            });
        }

        // 建立地面東方淨琉璃曼荼羅幾何光陣
        function buildMandalaFloorGrid() {
            const floorGroup = new THREE.Group();
            floorGroup.position.y = -2.2;
            scene.add(floorGroup);

            const radii = [5.5, 9.8, 14.5, 16.2];
            radii.forEach((r, idx) => {
                const ringGeo = new THREE.RingGeometry(r - 0.06, r + 0.06, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: idx % 2 === 0 ? 0xffd700 : 0x00e5ff,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: idx === 2 ? 0.45 : 0.22
                });
                const mesh = new THREE.Mesh(ringGeo, ringMat);
                mesh.rotation.x = Math.PI / 2;
                floorGroup.add(mesh);
            });

            // 十二道方位輻射細金線
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const pts = [
                    new THREE.Vector3(Math.cos(angle) * 4.2, 0, Math.sin(angle) * 4.2),
                    new THREE.Vector3(Math.cos(angle) * 16.0, 0, Math.sin(angle) * 16.0)
                ];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                const lineMat = new THREE.LineBasicMaterial({
                    color: 0x00e5ff,
                    transparent: true,
                    opacity: 0.18
                });
                floorGroup.add(new THREE.Line(lineGeo, lineMat));
            }
        }

        // 建立十二大願 3D 琉璃蓮花經幢與能量光束
        function buildTwelveVowLanterns() {
            mandalaOrbitGroup = new THREE.Group();
            scene.add(mandalaOrbitGroup);

            const orbitRadius = 14.5;
            const labelsContainer = document.getElementById('labels-container');
            labelsContainer.innerHTML = '';

            // 分類對應色
            const categoryColors = {
                light: 0xfde047,
                abundance: 0x38bdf8,
                healing: 0x34d399,
                wisdom: 0xc084fc
            };

            vowsData.forEach((vow, index) => {
                // 從正前方順時針排列 12 願
                const angle = (index / 12) * Math.PI * 2;
                const x = Math.sin(angle) * orbitRadius;
                const z = Math.cos(angle) * orbitRadius;

                const lanternGroup = new THREE.Group();
                lanternGroup.position.set(x, 0, z);
                lanternGroup.userData = { vowId: vow.id, baseAngle: angle };
                mandalaOrbitGroup.add(lanternGroup);

                // 1. 經幢底座 (黃金六角蓮座)
                const baseGeo = new THREE.CylinderGeometry(1.05, 1.35, 0.45, 6);
                const goldMat = new THREE.MeshStandardMaterial({
                    color: 0xd9a441,
                    emissive: 0x3a2500,
                    metalness: 0.75,
                    roughness: 0.25
                });
                const baseMesh = new THREE.Mesh(baseGeo, goldMat);
                baseMesh.position.y = -0.8;
                lanternGroup.add(baseMesh);

                // 2. 蓮花燈瓣環 (8瓣)
                const petalGeo = new THREE.ConeGeometry(0.36, 0.9, 4);
                petalGeo.scale(1, 1, 0.35);
                const petalMat = new THREE.MeshStandardMaterial({
                    color: 0x1e4d8c,
                    emissive: 0x072142,
                    metalness: 0.5,
                    roughness: 0.3
                });
                const petalsRing = new THREE.Group();
                petalsRing.position.y = -0.45;
                for (let p = 0; p < 8; p++) {
                    const pAngle = (p / 8) * Math.PI * 2;
                    const petal = new THREE.Mesh(petalGeo, petalMat);
                    petal.position.set(Math.cos(pAngle) * 0.85, 0, Math.sin(pAngle) * 0.85);
                    petal.rotation.y = -pAngle + Math.PI / 2;
                    petal.rotation.x = 0.65;
                    petalsRing.add(petal);
                }
                lanternGroup.add(petalsRing);

                // 3. 琉璃燈心主體 (尚未點亮時呈深青琉璃色，點亮後轉為耀眼金光)
                const coreGeo = new THREE.OctahedronGeometry(0.82, 1);
                const coreMat = new THREE.MeshPhongMaterial({
                    color: 0x00b4d8,
                    emissive: 0x053b5e,
                    specular: 0xffffff,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.85,
                    flatShading: true
                });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                coreMesh.position.y = 0.35;
                coreMesh.userData = { vowId: vow.id }; // 供 Raycaster 點擊偵測
                lanternGroup.add(coreMesh);

                // 4. 點燈後的內部立體火蓮特效 (預設隱藏)
                const flameGeo = new THREE.ConeGeometry(0.42, 1.1, 6);
                const flameMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.95
                });
                const flameMesh = new THREE.Mesh(flameGeo, flameMat);
                flameMesh.position.y = 0.45;
                flameMesh.visible = false;
                lanternGroup.add(flameMesh);

                // 5. 經幢寶蓋頂 (黃金六角傘蓋)
                const roofGeo = new THREE.ConeGeometry(1.15, 0.65, 6);
                const roofMesh = new THREE.Mesh(roofGeo, goldMat);
                roofMesh.position.y = 1.45;
                lanternGroup.add(roofMesh);

                // 6. 分類光環圈
                const catRingGeo = new THREE.TorusGeometry(1.25, 0.035, 8, 32);
                const catRingMat = new THREE.MeshBasicMaterial({
                    color: categoryColors[vow.category] || 0x00e5ff,
                    transparent: true,
                    opacity: 0.45
                });
                const catRingMesh = new THREE.Mesh(catRingGeo, catRingMat);
                catRingMesh.rotation.x = Math.PI / 2;
                catRingMesh.position.y = -0.55;
                lanternGroup.add(catRingMesh);

                // 7. 連結至中央琉璃摩尼寶珠的 3D 金色能量光束 (預設隱藏，點燈時啟動)
                const startPt = new THREE.Vector3(x, 0.35, z);
                const endPt = new THREE.Vector3(0, 1.6, 0);
                const distance = startPt.distanceTo(endPt);

                const beamGeo = new THREE.CylinderGeometry(0.055, 0.12, distance, 8, 1, true);
                beamGeo.translate(0, distance / 2, 0);
                beamGeo.rotateX(Math.PI / 2);

                const beamMat = new THREE.MeshBasicMaterial({
                    color: 0xffd700,
                    transparent: true,
                    opacity: 0.78,
                    side: THREE.DoubleSide
                });
                const beamMesh = new THREE.Mesh(beamGeo, beamMat);
                beamMesh.position.copy(startPt);
                beamMesh.lookAt(endPt);
                beamMesh.visible = false;
                mandalaOrbitGroup.add(beamMesh);

                // 光束上流動的能量光球
                const pulseOrbGeo = new THREE.SphereGeometry(0.22, 12, 12);
                const pulseOrbMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const pulseOrb = new THREE.Mesh(pulseOrbGeo, pulseOrbMat);
                pulseOrb.visible = false;
                mandalaOrbitGroup.add(pulseOrb);

                // 8. 建立對應的 2D 懸浮投影標籤 DOM
                const labelEl = document.createElement('div');
                labelEl.id = `label-vow-${vow.id}`;
                labelEl.className = 'vow-3d-label glass-panel px-2.5 py-1 rounded-full border border-cyanGlow-400/40 text-xs flex items-center gap-1.5 shadow-lg';
                labelEl.onclick = (e) => {
                    e.stopPropagation();
                    focusOnVow(vow.id);
                };
                labelEl.innerHTML = `
                    <span id="label-icon-${vow.id}" class="text-xs">🕯️</span>
                    <span class="font-bold text-gold-300 font-sans">第${vow.id}願</span>
                    <span class="text-slate-100 hidden sm:inline">${vow.shortTitle}</span>
                `;
                labelsContainer.appendChild(labelEl);

                lanternObjects.push({
                    id: vow.id,
                    vow: vow,
                    group: lanternGroup,
                    coreMesh: coreMesh,
                    petalMat: petalMat,
                    flameMesh: flameMesh,
                    catRingMesh: catRingMesh,
                    beamMesh: beamMesh,
                    pulseOrb: pulseOrb,
                    startPt: startPt,
                    endPt: endPt,
                    labelEl: labelEl
                });
            });
        }

        // 建立 3D 琉璃光點粒子星雲與圓滿金雨特效
        function buildParticleNebula() {
            const count = 650;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorCyan = new THREE.Color(0x00e5ff);
            const colorGold = new THREE.Color(0xffd700);

            for (let i = 0; i < count; i++) {
                const r = 4 + Math.random() * 28;
                const theta = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.35) * 24;

                positions[i * 3] = Math.cos(theta) * r;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = Math.sin(theta) * r;

                const c = Math.random() > 0.42 ? colorCyan : colorGold;
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.48,
                map: createGlowTexture('#ffffff', '#00e5ff'),
                vertexColors: true,
                transparent: true,
                opacity: 0.78,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);

            // 圓滿點亮十二燈時的「漫天琉璃金雨」粒子系統
            const rainCount = 350;
            const rainPos = new Float32Array(rainCount * 3);
            for (let i = 0; i < rainCount; i++) {
                rainPos[i * 3] = (Math.random() - 0.5) * 36;
                rainPos[i * 3 + 1] = Math.random() * 26 - 4;
                rainPos[i * 3 + 2] = (Math.random() - 0.5) * 36;
            }
            const rainGeo = new THREE.BufferGeometry();
            rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
            const rainMat = new THREE.PointsMaterial({
                size: 0.65,
                map: createGlowTexture('#ffffff', '#ffd700'),
                color: 0xffd700,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            completionRainSystem = new THREE.Points(rainGeo, rainMat);
            completionRainSystem.visible = false;
            scene.add(completionRainSystem);
        }

        // 觸發中央摩尼寶珠 3D 環狀光波擴散特效
        function triggerCentralShockwave(hexColor = 0xffd700) {
            const ringGeo = new THREE.RingGeometry(1.5, 2.1, 48);
            const ringMat = new THREE.MeshBasicMaterial({
                color: hexColor,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });
            const mesh = new THREE.Mesh(ringGeo, ringMat);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.y = 0.2;
            scene.add(mesh);
            shockwaves.push({ mesh: mesh, scale: 1.0, opacity: 0.9 });
        }

        /* =========================================================================
         * 肆、滑鼠 / 觸控 360° 旋轉、縮放與 Raycaster 點擊蓮燈互動
         * ========================================================================= */
        function bindInteractionEvents(domEl) {
            domEl.addEventListener('mousedown', (e) => {
                camState.isDragging = true;
                camState.dragMoved = false;
                camState.prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!camState.isDragging) return;
                const dx = e.clientX - camState.prevMouse.x;
                const dy = e.clientY - camState.prevMouse.y;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) camState.dragMoved = true;

                // 若在聚焦模式拖曳超過一定幅度，自動切換為全景自由旋轉
                if (camState.mode === 'focus' && camState.dragMoved) {
                    camState.mode = 'overview';
                    camState.lookAtTarget.set(0, 0.5, 0);
                }

                camState.targetAzimuth -= dx * 0.0065;
                camState.targetPolar = Math.max(0.35, Math.min(1.48, camState.targetPolar - dy * 0.0055));
                camState.prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', (e) => {
                if (camState.isDragging && !camState.dragMoved) {
                    handleCanvasClick(e.clientX, e.clientY);
                }
                camState.isDragging = false;
            });

            // 滾輪縮放
            domEl.addEventListener('wheel', (e) => {
                e.preventDefault();
                camState.targetRadius = Math.max(11, Math.min(42, camState.targetRadius + e.deltaY * 0.018));
            }, { passive: false });

            // 行動裝置觸控支援
            let touchStartDist = 0;
            domEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    camState.isDragging = true;
                    camState.dragMoved = false;
                    camState.prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    touchStartDist = Math.hypot(dx, dy);
                }
            }, { passive: true });

            domEl.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && camState.isDragging) {
                    const dx = e.touches[0].clientX - camState.prevMouse.x;
                    const dy = e.touches[0].clientY - camState.prevMouse.y;
                    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) camState.dragMoved = true;

                    if (camState.mode === 'focus' && camState.dragMoved) {
                        camState.mode = 'overview';
                        camState.lookAtTarget.set(0, 0.5, 0);
                    }

                    camState.targetAzimuth -= dx * 0.0065;
                    camState.targetPolar = Math.max(0.35, Math.min(1.48, camState.targetPolar - dy * 0.0055));
                    camState.prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    camState.targetRadius = Math.max(12, Math.min(42, camState.targetRadius + (touchStartDist - dist) * 0.06));
                    touchStartDist = dist;
                }
            }, { passive: true });

            domEl.addEventListener('touchend', (e) => {
                if (camState.isDragging && !camState.dragMoved && e.changedTouches.length === 1) {
                    handleCanvasClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
                camState.isDragging = false;
            });
        }

        // Raycaster 偵測點擊 3D 蓮燈或中央琉璃摩尼寶珠
        function handleCanvasClick(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // 檢查是否點擊十二蓮燈
            const clickableMeshes = [];
            lanternObjects.forEach(item => {
                item.group.traverse(child => {
                    if (child.isMesh) {
                        child.userData.vowId = item.id;
                        clickableMeshes.push(child);
                    }
                });
            });

            const intersects = raycaster.intersectObjects(clickableMeshes, false);
            if (intersects.length > 0) {
                const hitVowId = intersects[0].object.userData.vowId;
                if (hitVowId) {
                    focusOnVow(hitVowId);
                    return;
                }
            }

            // 檢查是否點擊中央摩尼寶珠 -> 敲響琉璃頌缽並擴散光波
            const centerHits = raycaster.intersectObject(centralOuterShell, false);
            if (centerHits.length > 0) {
                strikeMeditationBowl();
            }
        }

        /* =========================================================================
         * 伍、鏡頭平滑飛躍 (Camera Fly-to) 與四大修持視角模式
         * ========================================================================= */
        // 聚焦至指定大願的 3D 蓮花經幢
        function focusOnVow(vowId, fromTour = false) {
            if (!fromTour && isPilgrimageTour) {
                stopPilgrimageTour();
            }

            activeVowId = vowId;
            camState.mode = 'focus';

            // 播放對應五聲音階頌缽音
            const freq = pentatonicScale[(vowId - 1) % pentatonicScale.length];
            playSingingBowl(freq, 2.8);

            // 更新右側大願詳情面板與底部導覽列
            openVowDetailPanel(vowId);
            renderBottomDock();
            updateHighlightStates();
        }

        // 返回壇城全景視角
        function setCameraOverview() {
            if (isPilgrimageTour) stopPilgrimageTour();
            stopSpeech();
            activeVowId = null;
            camState.mode = 'overview';
            camState.targetRadius = 27;
            camState.targetPolar = 1.05;
            camState.lookAtTarget.set(0, 0.5, 0);

            closeVowDetailPanel();
            renderBottomDock();
            updateHighlightStates();
            playSingingBowl(432, 2.4);
        }

        // 前後大願切換
        function navigateVow(delta) {
            const current = activeVowId || 1;
            let nextId = current + delta;
            if (nextId > 12) nextId = 1;
            if (nextId < 1) nextId = 12;
            focusOnVow(nextId);
        }

        // 切換「逐願巡禮模式」
        function togglePilgrimageTour() {
            if (isPilgrimageTour) {
                stopPilgrimageTour();
                return;
            }
            isPilgrimageTour = true;
            document.getElementById('tour-icon').innerText = '⏹️';
            document.getElementById('tour-text').innerText = '停止巡禮';
            document.getElementById('btn-mode-tour').classList.add('border-gold-400', 'text-gold-300');

            let stepVowId = activeVowId ? activeVowId : 1;
            runTourStep(stepVowId);
        }

        function runTourStep(vowId) {
            if (!isPilgrimageTour) return;
            focusOnVow(vowId, true);

            // 自動為巡禮經過的蓮燈點亮心燈
            if (!litVows.has(vowId)) {
                setLanternLitState(vowId, true);
            }

            tourTimer = setTimeout(() => {
                if (!isPilgrimageTour) return;
                const nextId = vowId < 12 ? vowId + 1 : 1;
                runTourStep(nextId);
            }, 5200);
        }

        function stopPilgrimageTour() {
            isPilgrimageTour = false;
            if (tourTimer) clearTimeout(tourTimer);
            document.getElementById('tour-icon').innerText = '🔭';
            document.getElementById('tour-text').innerText = '逐願巡禮模式';
            document.getElementById('btn-mode-tour').classList.remove('border-gold-400', 'text-gold-300');
        }

        // 抽取今日相應大願 (3D 壇城加速旋轉後飛向相應蓮燈)
        function drawLuckyVow3D() {
            if (isPilgrimageTour) stopPilgrimageTour();
            setCameraOverview();
            spinBoostSpeed = 0.14; // 賦予壇城加速旋轉動量

            playSingingBowl(523.25, 2.0);
            setTimeout(() => playSingingBowl(659.25, 2.0), 300);
            setTimeout(() => playSingingBowl(783.99, 2.8), 600);

            const luckyId = Math.floor(Math.random() * 12) + 1;
            setTimeout(() => {
                focusOnVow(luckyId);
            }, 1500);
        }

        function toggleAutoOrbit() {
            isAutoOrbit = !isAutoOrbit;
            const btn = document.getElementById('btn-orbit-toggle');
            btn.innerText = isAutoOrbit ? '🔄 公轉中' : '⏸️ 暫停公轉';
        }

        /* =========================================================================
         * 陸、3D 點燈光束連結特效與「琉璃光海大圓滿」
         * ========================================================================= */
        function toggleCurrentVowLight() {
            if (!activeVowId) return;
            const isLit = litVows.has(activeVowId);
            setLanternLitState(activeVowId, !isLit);
        }

        function setLanternLitState(vowId, shouldLight) {
            const item = lanternObjects.find(o => o.id === vowId);
            if (!item) return;

            if (shouldLight) {
                litVows.add(vowId);
                // 3D 蓮燈核心轉為耀眼純金光與火蓮
                item.coreMesh.material.color.setHex(0xffd700);
                item.coreMesh.material.emissive.setHex(0xb45309);
                item.petalMat.color.setHex(0xd9a441);
                item.petalMat.emissive.setHex(0x452700);
                item.flameMesh.visible = true;
                // 啟動射向中央琉璃摩尼寶珠的 3D 金色能量光束
                item.beamMesh.visible = true;
                item.pulseOrb.visible = true;

                item.labelEl.classList.add('lit');
                document.getElementById(`label-icon-${vowId}`).innerText = '🏮';

                const freq = pentatonicScale[(litVows.size - 1) % pentatonicScale.length];
                playSingingBowl(freq, 3.0);
                triggerCentralShockwave(0xffd700);
            } else {
                litVows.delete(vowId);
                item.coreMesh.material.color.setHex(0x00b4d8);
                item.coreMesh.material.emissive.setHex(0x053b5e);
                item.petalMat.color.setHex(0x1e4d8c);
                item.petalMat.emissive.setHex(0x072142);
                item.flameMesh.visible = false;
                item.beamMesh.visible = false;
                item.pulseOrb.visible = false;

                item.labelEl.classList.remove('lit');
                document.getElementById(`label-icon-${vowId}`).innerText = '🕯️';
            }

            updateHUDLitCount();
            if (activeVowId === vowId) {
                updatePanelLightButton(vowId);
            }
            renderBottomDock();

            // 檢查是否達成 12 盞燈全部點亮「琉璃光海大圓滿」
            if (litVows.size === 12) {
                triggerGrandCompletionEffect();
            } else {
                completionRainSystem.visible = false;
                document.getElementById('grand-completion-banner').classList.add('hidden');
            }
        }

        // 一鍵點亮全部十二盞琉璃蓮燈
        function igniteAllLanterns() {
            vowsData.forEach((v, idx) => {
                setTimeout(() => {
                    setLanternLitState(v.id, true);
                }, idx * 90);
            });
        }

        // 12 燈全亮：觸發「琉璃光海大圓滿」3D 動畫特效
        function triggerGrandCompletionEffect() {
            completionRainSystem.visible = true;
            document.getElementById('grand-completion-banner').classList.remove('hidden');

            // 中央摩尼寶珠核心轉為璀璨金青琉璃光

                centralJewelGroup.userData.coreGlowSphere.material.color.setHex(0xffe066);

            setTimeout(() => triggerCentralShockwave(0xffd700), 700);

            // 播放莊嚴大圓滿和弦頌缽音
            playSingingBowl(523.25, 4.5, -0.4);
            playSingingBowl(659.25, 4.5, 0.0);

        function updateHUDLitCount() {

        /* =========================================================================
         * 柒、大願經文詳情面板、難字注音與語音恭誦 (TTS)
         * ========================================================================= */
        function formatTextWithRubyHints(rawText) {
            let html = rawText;
            pronunciationDict.forEach((entry, idx) => {
                const regex = new RegExp(entry.word, 'g');
                html = html.replace(
                    regex,
                    `<span class="ruby-term" onclick="showPronunciationNote(${idx})" title="${entry.note}">${entry.word}</span>`
                );
            });
            return html;
        }

        function showPronunciationNote(index) {
            const entry = pronunciationDict[index];
            if (!entry) return;
            const box = document.getElementById('pronunciation-helper-box');
            box.innerHTML = `<span class="text-gold-400 font-bold">【${entry.word}】</span> ${entry.note}`;
            box.classList.remove('hidden');
            playSingingBowl(880, 1.2);
        }

        function openVowDetailPanel(vowId) {
            const vow = vowsData.find(v => v.id === vowId);
            if (!vow) return;

            document.getElementById('panel-cat-badge').innerText = vow.categoryName;
            document.getElementById('panel-vow-title').innerText = `第${vow.id}大願・${vow.shortTitle}`;
            document.getElementById('panel-vow-original').innerHTML = formatTextWithRubyHints(vow.original);
            document.getElementById('panel-vow-meaning').innerText = vow.meaning;
            document.getElementById('panel-vow-practice').innerText = vow.practice;
            document.getElementById('pronunciation-helper-box').classList.add('hidden');

            updatePanelLightButton(vowId);

            const drawer = document.getElementById('vow-detail-drawer');
            drawer.classList.remove('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
            drawer.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
        }

        function updatePanelLightButton(vowId) {
            const isLit = litVows.has(vowId);
            const statusBadge = document.getElementById('panel-lit-status');
            const btn = document.getElementById('panel-btn-light');
            const btnText = document.getElementById('panel-btn-light-text');

                statusBadge.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-gold-400/20 text-gold-300 border border-gold-400/50';
                statusBadge.innerText = '🏮 已點亮琉璃燈・能量連結中';
                btn.className = 'flex-1 py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5 shadow-lg active:scale-95 bg-lapis-800 border border-gold-400 text-gold-300';
                btnText.innerText = '已點亮（點擊可熄滅）';
            } else {
                statusBadge.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-800 text-slate-300';
                statusBadge.innerText = '🕯️ 尚未點燈';
                btn.className = 'flex-1 py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5 shadow-lg active:scale-95 bg-gradient-to-r from-gold-500 to-amber-400 text-lapis-950';
                btnText.innerText = '點亮此願 3D 琉璃燈';
            }
        }

        function closeVowDetailPanel() {
            const drawer = document.getElementById('vow-detail-drawer');
            drawer.classList.add('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
            drawer.classList.remove('translate-x-0', 'opacity-100', 'pointer-events-auto');
        }

        // 語音恭誦當前大願經文
        let isSpeaking = false;
        function speakCurrentVow() {
            if (!('speechSynthesis' in window) || !activeVowId) return;
            if (isSpeaking) {
                stopSpeech();
                return;
            }
            const vow = vowsData.find(v => v.id === activeVowId);
            if (!vow) return;

            window.speechSynthesis.cancel();
            isSpeaking = true;
            document.getElementById('panel-speak-icon').innerText = '⏹️';
            document.getElementById('panel-speak-text').innerText = '停止';

            const utter = new SpeechSynthesisUtterance(vow.original);
            utter.lang = 'zh-TW';
            utter.rate = 0.88;
            utter.onend = () => stopSpeech();
            utter.onerror = () => stopSpeech();
            window.speechSynthesis.speak(utter);
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            isSpeaking = false;
            const icon = document.getElementById('panel-speak-icon');
            const txt = document.getElementById('panel-speak-text');
            if (icon) icon.innerText = '🔊';
            if (txt) txt.innerText = '恭誦';
        }

        /* =========================================================================
         * 捌、四大悲願分類篩選高亮與底部十二願快速導覽輪盤
         * ========================================================================= */
        function filterCategory(category, btnEl) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = 'cat-btn px-2.5 py-1 rounded-full text-xs text-slate-200 hover:text-gold-300 transition whitespace-nowrap';
            });
            btnEl.className = 'cat-btn px-2.5 py-1 rounded-full text-xs font-semibold bg-gold-400 text-lapis-950 transition whitespace-nowrap';

            updateHighlightStates();
            renderBottomDock();
            playSingingBowl(587.33, 1.8);
        }

        function updateHighlightStates() {
            lanternObjects.forEach(item => {
                const matchCat = currentCategory === 'all' || item.vow.category === currentCategory;
                const isFocused = activeVowId === item.id;

                // 調整 3D 蓮燈縮放與分類光環亮度
                const targetScale = isFocused ? 1.28 : (matchCat ? 1.0 : 0.72);
                item.group.scale.setScalar(targetScale);
                item.catRingMesh.material.opacity = matchCat ? 0.85 : 0.15;

                // 調整 2D 懸浮標籤高亮狀態
                if (isFocused) {
                    item.labelEl.classList.add('active-vow');
                } else {
                    item.labelEl.classList.remove('active-vow');
                }
                item.labelEl.style.opacity = matchCat ? '1' : '0.32';
            });
        }

        function renderBottomDock() {
            const dock = document.getElementById('bottom-vows-dock');
            dock.innerHTML = '';

            vowsData.forEach(vow => {
                const isLit = litVows.has(vow.id);
                const isFocused = activeVowId === vow.id;
                const matchCat = currentCategory === 'all' || vow.category === currentCategory;

                const btn = document.createElement('button');
                btn.onclick = () => focusOnVow(vow.id);
                btn.className = `px-3 py-1.5 rounded-xl border text-xs transition flex items-center gap-1.5 shrink-0 font-sans ${
                    isFocused
                        ? 'bg-cyanGlow-400/25 border-cyanGlow-400 text-white shadow-[0_0_15px_rgba(0,229,255,0.45)] scale-105'
                        : isLit
                            ? 'bg-amber-500/20 border-gold-400/70 text-gold-200'
                            : 'bg-lapis-900/75 border-slate-700/80 text-slate-300 hover:border-cyanGlow-400/50'
                } ${matchCat ? 'opacity-100' : 'opacity-40'}`;

                btn.innerHTML = `
                    <span>${isLit ? '🏮' : '🕯️'}</span>
                    <span class="font-bold">${vow.id}願</span>
                    <span class="hidden md:inline text-[11px] opacity-90">${vow.shortTitle}</span>
                `;
                dock.appendChild(btn);
            });
        }

        /* =========================================================================
         * 玖、動畫主迴圈 (60fps Render Loop & 3D 座標投影更新)
         * ========================================================================= */
        const clock = new THREE.Clock();
        const tempProjVec = new THREE.Vector3();
        const tempLanternWorldPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // 1. 中央琉璃摩尼寶珠呼吸與光環旋轉
            if (centralJewelGroup) {
                const breathe = 1 + Math.sin(elapsed * 2.2) * 0.045;
                centralOuterShell.scale.setScalar(breathe);
                centralOuterShell.rotation.y = elapsed * 0.25;
                centralCoreMesh.rotation.y = -elapsed * 0.6;
                centralCoreMesh.rotation.x = elapsed * 0.4;
                lotusThroneGroup.rotation.y = elapsed * 0.08;

                haloRings.forEach((ring, idx) => {
                    ring.rotation.z += (idx % 2 === 0 ? 0.008 : -0.006);
                    ring.rotation.y += 0.004;
                });
            }

            // 2. 十二大願曼荼羅公轉與抽籤加速旋轉衰減
            if (mandalaOrbitGroup) {
                if (spinBoostSpeed > 0.0005) {
                    mandalaOrbitGroup.rotation.y += spinBoostSpeed;
                    spinBoostSpeed *= 0.95;
                } else if (isAutoOrbit && camState.mode === 'overview') {
                    mandalaOrbitGroup.rotation.y += 0.0018;
                }
            }

            // 3. 更新每座 3D 蓮燈的自轉、點燈火蓮脈動與能量光束粒子流動
            lanternObjects.forEach((item, idx) => {
                item.coreMesh.rotation.y = elapsed * 0.8 + idx;
                item.coreMesh.position.y = 0.35 + Math.sin(elapsed * 2.5 + idx) * 0.08;

                if (item.flameMesh.visible) {
                    const flameScale = 0.9 + Math.sin(elapsed * 8 + idx) * 0.15;
                    item.flameMesh.scale.set(flameScale, 1 + Math.cos(elapsed * 6) * 0.15, flameScale);
                    item.flameMesh.rotation.y += 0.04;
                }

                // 能量光球沿光束飛向中央摩尼寶珠
                if (item.pulseOrb.visible) {
                    const t = ((elapsed * 0.65 + idx * 0.12) % 1);
                    item.pulseOrb.position.lerpVectors(item.startPt, item.endPt, t);
                }
            });

            // 4. 更新琉璃光點粒子星雲緩緩上升與旋轉
            if (particleSystem) {
                particleSystem.rotation.y = elapsed * 0.03;
                const posArr = particleSystem.geometry.attributes.position.array;
                for (let i = 1; i < posArr.length; i += 3) {
                    posArr[i] += 0.015;
                    if (posArr[i] > 14) posArr[i] = -10;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // 5. 更新圓滿金雨粒子飄落
            if (completionRainSystem && completionRainSystem.visible) {
                const rainArr = completionRainSystem.geometry.attributes.position.array;
                for (let i = 1; i < rainArr.length; i += 3) {
                    rainArr[i] -= 0.045;
                    if (rainArr[i] < -4) rainArr[i] = 22;
                }
                completionRainSystem.geometry.attributes.position.needsUpdate = true;
            }

            // 6. 更新中央光波擴散環
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.scale += 0.22;
                sw.opacity -= 0.016;
                sw.mesh.scale.setScalar(sw.scale);
                sw.mesh.material.opacity = Math.max(0, sw.opacity);
                if (sw.opacity <= 0) {
                    scene.remove(sw.mesh);
                    sw.mesh.geometry.dispose();
                    sw.mesh.material.dispose();
                    shockwaves.splice(i, 1);
                }
            }

            // 7. 計算鏡頭目標位置與平滑飛躍 (Smooth Camera Lerp)
            if (camState.mode === 'focus' && activeVowId) {
                const targetItem = lanternObjects.find(o => o.id === activeVowId);
                if (targetItem) {
                    targetItem.group.getWorldPosition(tempLanternWorldPos);
                    // 計算從原點指向該蓮燈的方向向量，讓鏡頭停在蓮燈外側偏高處往內看，同時看到蓮燈與後方中央摩尼寶珠
                    const dir = tempLanternWorldPos.clone().normalize();
                    const rightOffset = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(window.innerWidth > 640 ? 2.1 : 0);

                    camState.targetPos.copy(tempLanternWorldPos)
                        .addScaledVector(dir, 6.2)
                        .add(new THREE.Vector3(0, 2.3, 0))
                        .add(rightOffset);

                    camState.lookAtTarget.copy(tempLanternWorldPos)
                        .add(new THREE.Vector3(0, 0.4, 0))
                        .addScaledVector(rightOffset, 0.35);
                }
            } else {
                // 全景球座標平滑插值
                camState.sphericalRadius += (camState.targetRadius - camState.sphericalRadius) * 0.08;
                camState.polarAngle += (camState.targetPolar - camState.polarAngle) * 0.08;
                camState.azimuthAngle += (camState.targetAzimuth - camState.azimuthAngle) * 0.08;

                camState.targetPos.set(
                    camState.sphericalRadius * Math.sin(camState.polarAngle) * Math.sin(camState.azimuthAngle),
                    camState.sphericalRadius * Math.cos(camState.polarAngle),
                    camState.sphericalRadius * Math.sin(camState.polarAngle) * Math.cos(camState.azimuthAngle)
                );
            }

            camState.currentPos.lerp(camState.targetPos, 0.065);
            camState.lookAtCurrent.lerp(camState.lookAtTarget, 0.08);
            camera.position.copy(camState.currentPos);
            camera.lookAt(camState.lookAtCurrent);

            // 8. 渲染 3D 場景並更新 12 座蓮燈的 2D 投影標籤座標
            renderer.render(scene, camera);
            update2DProjectedLabels();
        }

        function update2DProjectedLabels() {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;

            lanternObjects.forEach(item => {
                item.group.getWorldPosition(tempProjVec);
                tempProjVec.y += 2.15; // 標籤懸浮於蓮燈寶蓋上方

                const distToCam = camera.position.distanceTo(tempProjVec);
                tempProjVec.project(camera);

                // 判斷是否在鏡頭前方
                if (tempProjVec.z > 1) {
                    item.labelEl.style.display = 'none';
                    return;
                }

                const screenX = (tempProjVec.x * halfW) + halfW;
                const screenY = -(tempProjVec.y * halfH) + halfH;

                item.labelEl.style.display = 'flex';
                item.labelEl.style.left = `${screenX}px`;
                item.labelEl.style.top = `${screenY}px`;
                item.labelEl.style.zIndex = Math.round(100 - distToCam);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* =========================================================================
         * 拾、匯出 3D 琉璃祈福迴向卡（擷取即時 3D 壇城畫面合成 PNG）
         * ========================================================================= */
        function openDedicationModal() {
            captureFresh3DSnapshot();
            const modal = document.getElementById('dedication-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDedicationModal() {
            const modal = document.getElementById('dedication-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('modal-toast').classList.add('hidden');
        }

        function setQuickWish(wishText) {
            document.getElementById('input-wish').value = wishText;
            renderDedicationCardCanvas();
        }

        function captureFresh3DSnapshot() {
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
                captured3DDataUrl = renderer.domElement.toDataURL('image/png');
            }
            renderDedicationCardCanvas();
        }

        function getBuddhistDateStr() {
            const d = new Date();
            return `佛曆 ${d.getFullYear() + 544} 年・西元 ${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        }

        function renderDedicationCardCanvas() {
            const canvas = document.getElementById('dedication-card-canvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            const drawOverlayElements = () => {
                // 半透明深邃琉璃漸層遮罩，讓 3D 壇城在上方閃耀、下方文字清晰莊嚴
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, 'rgba(3, 12, 26, 0.35)');
                grad.addColorStop(0.45, 'rgba(5, 18, 38, 0.68)');
                grad.addColorStop(1, 'rgba(3, 10, 22, 0.92)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // 外層莊嚴雙金框
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.strokeRect(24, 24, W - 48, H - 48);
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(34, 34, W - 68, H - 68);

                // 標題
                ctx.textAlign = 'center';
                ctx.fillStyle = '#67e8f9';
                ctx.font = '600 17px "Noto Serif TC", serif';
                ctx.fillText('南無藥師琉璃光如來・東方淨琉璃世界 3D 曼荼羅壇城', W / 2, 76);

                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 34px "Noto Serif TC", serif';
                ctx.fillText('琉 璃 光 明 祈 福 迴 向 疏', W / 2, 124);

                // 金色分隔線
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.65)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(W / 2 - 180, 144);
                ctx.lineTo(W / 2 + 180, 144);
                ctx.stroke();

                // 讀取使用者輸入之祈福迴向內容
                const donor = document.getElementById('input-donor').value.trim() || '三寶弟子';
                const target = document.getElementById('input-target').value.trim() || '法界一切有情眾生';
                const wish = document.getElementById('input-wish').value.trim() || '眾病悉除，身心安樂，速證無上菩提。';

                const fullText = `弟子「${donor}」於東方淨琉璃世界 3D 曼荼羅壇城，至誠頂禮藥師琉璃光如來，恭誦十二大願並點亮琉璃心燈（${litVows.size}/12 盞）。願以此清淨功德，迴向予「${target}」：祈願仰仗藥師如來本願威神力，${wish}`;

                // 自動換行繪製內文
                ctx.fillStyle = '#f8fafc';
                ctx.font = '500 22px "Noto Serif TC", serif';
                ctx.textAlign = 'left';

                const maxWidth = W - 160;
                const startX = 80;
                let startY = 290;
                const lineHeight = 40;

                let line = '';
                for (let i = 0; i < fullText.length; i++) {
                    const testLine = line + fullText[i];
                    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                        ctx.fillText(line, startX, startY);
                        line = fullText[i];
                        startY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, startX, startY);

                // 底部點燈狀態與佛曆日期
                ctx.fillStyle = '#fde047';
                ctx.font = '600 17px "Noto Serif TC", serif';
                ctx.textAlign = 'left';
                ctx.fillText(`🏮 壇城已點亮琉璃心燈：${litVows.size} / 12 盞`, 80, H - 56);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#bae6fd';
                ctx.fillText(getBuddhistDateStr(), W - 80, H - 56);
            };

            if (captured3DDataUrl) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, W, H);
                    // 等比例滿版繪製 3D 截圖
                    const scale = Math.max(W / img.width, H / img.height);
                    const nw = img.width * scale;
                    const nh = img.height * scale;
                    ctx.drawImage(img, (W - nw) / 2, (H - nh) / 2, nw, nh);
                    drawOverlayElements();
                };
                img.src = captured3DDataUrl;
            } else {
                ctx.fillStyle = '#06152d';
                ctx.fillRect(0, 0, W, H);
                drawOverlayElements();
            }
        }

        function copyDedicationText() {
            const donor = document.getElementById('input-donor').value.trim() || '三寶弟子';
            const target = document.getElementById('input-target').value.trim() || '法界一切有情眾生';
            const wish = document.getElementById('input-wish').value.trim() || '眾病悉除，身心安樂，速證無上菩提。';
            const text = `【藥師琉璃光如來十二大願・琉璃光明祈福迴向疏】\n弟子「${donor}」至誠頂禮藥師琉璃光如來，恭誦十二大願並點亮琉璃心燈（${litVows.size}/12盞）。\n願以此功德迴向予「${target}」：祈願${wish}\n（${getBuddhistDateStr()}）🙏`;

            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showModalToast('✨ 已複製祈福迴向文至剪貼簿！');
            } catch (err) {
                showModalToast('複製完成');
            }
            document.body.removeChild(ta);
        }

        function download3DDedicationCard() {
            const canvas = document.getElementById('dedication-card-canvas');
            const link = document.createElement('a');
            link.download = '藥師如來3D琉璃壇城祈福迴向卡.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showModalToast('🖼️ 3D 琉璃祈福迴向圖卡已開始下載！');
        }

        function showModalToast(msg) {
            const t = document.getElementById('modal-toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3800);
        }

        /* =========================================================================
         * 拾壹、初始化啟動
         * ========================================================================= */
        window.onload = function () {
            init3DScene();
            renderBottomDock();
            updateHighlightStates();
            animate();
        };
    </script>
</body>
</html>
