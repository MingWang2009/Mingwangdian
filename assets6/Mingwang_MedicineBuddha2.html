<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#0b3154" />
        <title>藥師琉璃光如來｜十二大願</title>
        <style>
            :root {
                --navy: #082b4c;
                --blue: #14547a;
                --teal: #69c9d0;
                --gold: #e9c477;
                --cream: #fff8e9;
                --ink: #153653;
                --muted: #d9e8ef;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                margin: 0;
                font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
                color: var(--cream);
                background: radial-gradient(ellipse at 50% 42%, #1b6680 0, #0b3558 42%, #061b33 100%);
                min-height: 100vh;
            }
            body:before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                opacity: 0.25;
                background-image: radial-gradient(circle at 15% 25%, #fff 0 1px, transparent 2px),
                    radial-gradient(circle at 78% 15%, #ffe9b0 0 1px, transparent 2px),
                    radial-gradient(circle at 64% 72%, #fff 0 1px, transparent 2px),
                    radial-gradient(circle at 30% 82%, #ffe9b0 0 1px, transparent 2px);
                background-size:
                    130px 130px,
                    170px 170px,
                    210px 210px,
                    190px 190px;
            }
            header {
                max-width: 1200px;
                margin: auto;
                padding: 28px 22px 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
            }
            .head-actions {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .head-actions button {
                border: 1px solid #d8bd7d;
                background: #ffffff0b;
                color: #ffe9b6;
                border-radius: 999px;
                padding: 8px 12px;
                font: inherit;
                cursor: pointer;
            }
            .head-actions button:hover {
                background: #ffffff20;
            }
            .brand {
                letter-spacing: 0.22em;
                font-size: 0.95rem;
                color: #f8d88f;
            }
            .tiny {
                font-size: 0.85rem;
                color: #c7dce8;
            }
main {
    max-width: 1200px;
    margin: auto;
    padding: 12px 22px 38px;
    display: grid;
    grid-template-columns: minmax(270px, .8fr) minmax(320px, 1fr) minmax(310px, 1fr);
    gap: 22px;
    align-items: start; /* 改為頂部對齊，解決高度變化造成的位移 */
}
            .intro h1 {
                font-size: clamp(2.3rem, 4.3vw, 4.6rem);
                line-height: 1.12;
                margin: 0.3em 0;
                color: #f7d38a;
                font-weight: 600;
                letter-spacing: 0.08em;
            }
            .intro h2 {
                font-size: 1.05rem;
                letter-spacing: 0.18em;
                font-weight: 400;
                color: #fff6d9;
            }
            .intro p {
                line-height: 2;
                letter-spacing: 0.08em;
                color: #d8e7ef;
            }
            .ornament {
                color: var(--gold);
                font-size: 1.4rem;
                margin: 20px 0;
            }
            .hint {
                display: inline-flex;
                gap: 10px;
                align-items: center;
                border: 1px solid #e8ca83;
                border-radius: 999px;
                padding: 12px 18px;
                color: #ffe9b6;
                font-size: 0.9rem;
            }
            @keyframes breathe {
                0%,
                100% {
                    transform: scale(1);
                    filter: drop-shadow(0 0 0 #8eeeff00);
                }
                50% {
                    transform: scale(1.025);
                    filter: drop-shadow(0 0 18px #8eeeff55);
                }
            }
            @keyframes drift {
                0%,
                100% {
                    translate: 0 0;
                }
                50% {
                    translate: 0 -7px;
                }
            }
            .halo {
                animation: breathe 7s ease-in-out infinite;
            }
            .buddha {
                animation: drift 6s ease-in-out infinite;
            }
            .mandala {
                position: relative;
                aspect-ratio: 1;
                max-width: 480px;
                width: 100%;
                margin: 0 auto;
                align-self: start;
                display: grid;
                place-items: center;
            }
            .halo {
                position: absolute;
                width: 70%;
                aspect-ratio: 1;
                border: 1px solid #f0d58c;
                border-radius: 50%;
                box-shadow:
                    0 0 28px #7bdde477,
                    inset 0 0 40px #e7c66c44;
                background: radial-gradient(circle, #f6dc9c22 0 30%, transparent 70%);
            }
            .halo:before,
            .halo:after {
                content: "";
                position: absolute;
                inset: 9%;
                border: 1px dashed #f6dca0a8;
                border-radius: 50%;
            }
            .halo:after {
                inset: 18%;
                border-style: solid;
                transform: rotate(30deg);
            }
.buddha-img {
    z-index: 1;
    width: 44.8%;       /* 精準對應光環最內圈 */
    aspect-ratio: 1;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #f6dca0a8;
    box-shadow: 0 0 35px #79e6e8a6;
    animation: drift 6s ease-in-out infinite; /* 保留原本的漂浮動畫 */
    
    /* 以下為新增的強制置中對齊設定 */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
            .wish-dot {
                position: absolute;
                width: 82px;
                height: 82px;
                border-radius: 50%;
                border: 2px solid #e7ca82;
                background: linear-gradient(145deg, #1e6789, #092c50);
                color: #fff4d4;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 0.25s, background 0.25s, color 0.25s, box-shadow 0.25s;
                box-shadow: 0 5px 20px #00152966;
                font-family: inherit;
            }
            .wish-dot strong {
                font-family: system-ui, sans-serif;
                font-size: 1.45rem;
                color: #f8d68b;
            }
            .wish-dot span {
                font-size: 0.75rem;
                margin-top: 3px;
            }
            .wish-dot:hover,
            .wish-dot:focus-visible {
                transform: scale(1.1);
                background: linear-gradient(145deg, #e9cc83, #fff0c5);
                color: #173c58;
                outline: none;
            }
            .wish-dot:hover strong,
            .wish-dot:focus-visible strong {
                color: #173c58;
            }
            .wish-dot.active {
                background: linear-gradient(145deg, #ffe5a0, #b77c2c);
                color: #123654;
                box-shadow:
                    0 0 0 5px #ffe5a033,
                    0 0 28px #f8d98c;
            }
            .wish-dot.active strong {
                color: #123654;
            }
            .detail {
                background: var(--cream);
                color: var(--ink);
                border: 2px solid #d6b86e;
                border-radius: 24px;
                padding: 25px;
                box-shadow: 0 18px 50px #00162955;
                position: relative;
                overflow: hidden;
            }
            .detail:before {
                content: "";
                position: absolute;
                inset: 7px;
                border: 1px solid #d7bf81;
                border-radius: 17px;
                pointer-events: none;
            }
            .detail-inner {
                position: relative;
            }
            .detail-top {
                display: flex;
                align-items: center;
                gap: 14px;
                border-bottom: 1px solid #ddcda5;
                padding-bottom: 14px;
            }
            .number {
                width: 54px;
                height: 54px;
                flex: none;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: linear-gradient(145deg, #1e5c80, #092b4d);
                color: #f8d88f;
                border: 3px solid #e4c576;
                font-family: system-ui, sans-serif;
                font-size: 1.5rem;
            }
            .detail h2 {
                font-size: 1.7rem;
                margin: 0;
                font-weight: 600;
                letter-spacing: 0.08em;
            }
            .lotus {
                margin-left: auto;
                color: #c99b3e;
                font-size: 1.5rem;
            }
            .vow-stack {
                display: grid;
            }
            .vow-slide {
                grid-area: 1 / 1;
                visibility: hidden;
                min-width: 0;
            }
            .vow-slide.on {
                visibility: visible;
            }
            .full-text {
                font-size: 1rem;
                line-height: 2.15;
                letter-spacing: 0.025em;
                white-space: normal;
                margin: 18px 0;
            }
            .meaning {
                background: #edf4f3;
                border-left: 3px solid #55aab0;
                padding: 12px 14px;
                line-height: 1.8;
                color: #28546a;
                border-radius: 0 10px 10px 0;
                font-size: 0.9rem;
            }
            .controls {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }
            .controls button,
            .all-btn {
                border: 0;
                border-radius: 999px;
                padding: 11px 16px;
                background: #123e61;
                color: #fff2cf;
                font: inherit;
                cursor: pointer;
                transition: 0.2s;
            }
            .controls button:hover,
            .all-btn:hover {
                background: #236d8b;
            }
            .controls button {
                white-space: nowrap;
            }
            #speak {
                min-width: 7.6em;
            }
            .controls button:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }
            .controls .next {
                margin-left: auto;
                background: #b88a38;
                color: #fff;
            }
            .progress {
                height: 4px;
                background: #e9dfc7;
                margin-top: 18px;
                border-radius: 9px;
                overflow: hidden;
            }
            .progress span {
                display: block;
                height: 100%;
                background: #c39a49;
                width: 8.333%;
                transition: width 0.25s;
            }
            .footer {
                text-align: center;
                padding: 0 20px 28px;
                color: #d9d5b7;
                letter-spacing: 0.18em;
                font-size: 0.85rem;
            }
            .all-section {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 22px 50px;
            }
            .all-section summary {
                cursor: pointer;
                color: #f7d38a;
                letter-spacing: 0.1em;
                padding: 14px 0;
            }
            .all-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .all-grid button {
                text-align: left;
                border: 1px solid #9bbbc7;
                background: #ffffff0b;
                color: #f7f2dc;
                border-radius: 12px;
                padding: 12px;
                cursor: pointer;
                font: inherit;
                line-height: 1.6;
            }
            .all-grid button:hover {
                background: #ffffff1c;
            }
            .all-grid b {
                color: #f4d28b;
                margin-right: 7px;
            }
            @media (max-width: 950px) {
                main {
                    grid-template-columns: 1fr 1fr;
                }
                .intro {
                    grid-column: 1/-1;
                    text-align: center;
                }
                .intro h1 {
                    font-size: 3rem;
                }
                .intro p {
                    margin: auto;
                    max-width: 540px;
                }
                .mandala {
                    max-width: 420px;
                }
                .detail {
                    padding: 20px;
                }
            }
            @media (max-width: 650px) {
                header {
                    padding: 20px 16px;
                }
                .head-actions {
                    flex-wrap: wrap;
                    justify-content: flex-end;
                }
                .head-actions .tiny {
                    display: none;
                }
                .head-actions button {
                    font-size: 0.78rem;
                    padding: 7px 9px;
                }
                .tiny {
                    display: none;
                }
                main {
                    display: flex;
                    flex-direction: column;
                    align-items: stretch;
                    padding: 8px 16px 28px;
                    gap: 20px;
                }
                .intro {
                    width: 100%;
                    text-align: center;
                }
                .intro h1 {
                    font-size: 2.65rem;
                }
                .intro p {
                    font-size: 0.95rem;
                }
                .mandala {
                    max-width: 390px;
                    width: 100%;
                }
                .wish-dot {
                    width: 64px;
                    height: 64px;
                }
                .wish-dot strong {
                    font-size: 1.15rem;
                }
                .wish-dot span {
                    font-size: 0.65rem;
                }
                .detail {
                    width: 100%;
                    padding: 20px;
                }
                .detail h2 {
                    font-size: 1.45rem;
                }
                .all-section {
                    padding: 0 16px 36px;
                }
                .all-grid {
                    grid-template-columns: 1fr 1fr;
                }
                .footer {
                    letter-spacing: 0.05em;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    scroll-behavior: auto !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="brand">☸　藥師琉璃光如來</div>
            <div class="head-actions">
                <span class="tiny">點選願次・靜心閱讀・發願實踐</span
                ><button id="fullscreen" type="button">⛶ 全螢幕</button
                ><button id="share" type="button">↗ 分享</button>
            </div>
        </header>
        <main>

                <div class="hint">☝ 點選願次，探索慈悲的力量</div>

                [
                    "第九大願",
                    "願我來世得菩提時，令諸有情，出魔羂網，解脫一切外道纏縛；若墮種種惡見稠林，皆當引攝置於正見，漸令修習諸菩薩行，速證無上正等菩提。",
                    "願我辨明迷惑與偏見，培養智慧，並以慈悲陪伴他人走出困境。",
                ],
                [
                    "第十大願",
                    "願我來世得菩提時，若諸有情，王法所錄，縲縛鞭撻，繫閉牢獄，或當刑戮，及餘無量災難，凌辱，悲愁煎逼，身心受苦；若聞我名，以我福德威神力故，皆得解脫一切憂苦。",
                    "願受苦受困者得到公正對待、援助與重新生活的機會。",
                ],
                [
                    "第十一大願",
                    "願我來世得菩提時，若諸有情，飢渴所惱，為求食故造諸惡業；得聞我名，專念受持，我當先以上妙飲食，飽足其身；後以法味，畢竟安樂而建立之。",
                    "願飢餓者得以溫飽；在照顧基本需要之後，也能獲得心靈支持。",
                ],
                [
                    "第十二大願",
                    "願我來世得菩提時，若諸有情，貧無衣服，蚊虻寒熱，晝夜逼惱；若聞我名，專念受持，如其所好，即得種種上妙衣服，亦得一切寶莊嚴具，華鬘塗香，鼓樂眾伎，隨心所翫，皆令滿足。",
                    "願受寒受困者有衣可穿、有尊嚴地生活，所需皆能獲得適切照顧。",
                ],
            ];
            const dots = document.getElementById("dots"),
                grid = document.getElementById("allGrid"),
                stack = document.getElementById("stack");
            // 12 slides share one grid cell -> panel height = tallest slide, so it never changes
            vows.forEach((v) => {
                const slide = document.createElement("div");
                slide.className = "vow-slide";
                const p = document.createElement("p");
                p.className = "full-text";
                p.textContent = v[1];
                const m = document.createElement("div");
                m.className = "meaning";
                const st = document.createElement("strong");
                st.textContent = "靜心一念";
                const r = document.createElement("div");
                r.textContent = v[2];
                m.append(st, r);
                slide.append(p, m);
                stack.appendChild(slide);
            });
            let current = 0;
            function selectVow(i) {
                if ("speechSynthesis" in window) speechSynthesis.cancel();
                document.getElementById("speak").textContent = "♫ 朗讀經文";
                current = (i + 12) % 12;
                document.getElementById("num").textContent = current + 1;
                document.getElementById("title").textContent = vows[current][0];
                stack.querySelectorAll(".vow-slide").forEach((el, j) => {
                    el.classList.toggle("on", j === current);
                    el.setAttribute("aria-hidden", j === current ? "false" : "true");
                });
                document.getElementById("bar").style.width = ((current + 1) / 12) * 100 + "%";
                document.getElementById("prev").disabled = current === 0;
                document.getElementById("next").disabled = current === 11;
                document.querySelectorAll(".wish-dot").forEach((b, j) => {
                    b.classList.toggle("active", j === current);
                    b.setAttribute("aria-pressed", j === current ? "true" : "false");
                });
            }
            vows.forEach((v, i) => {
                const b = document.createElement("button");
                b.type = "button";
                b.className = "wish-dot";
                b.style.left = 50 + 39 * Math.cos(-Math.PI / 2 + (i * 2 * Math.PI) / 12) + "%";
                b.style.top = 50 + 39 * Math.sin(-Math.PI / 2 + (i * 2 * Math.PI) / 12) + "%";
                b.style.translate = "-50% -50%";
                b.innerHTML =
                    "<strong>" +
                    (i + 1) +
                    "</strong><span>" +
                    ["光明", "琉璃", "資生", "正道", "淨戒", "諸根", "安樂", "平等", "正見", "解脫", "飲食", "衣具"][
                        i
                    ] +
                    "</span>";
                b.setAttribute("aria-label", v[0]);
                b.addEventListener("click", () => selectVow(i));
                dots.appendChild(b);
                const item = document.createElement("button");
                item.type = "button";
                item.innerHTML =
                    "<b>" + (i + 1).toString().padStart(2, "0") + "</b>" + v[0] + "<br><small>" + v[2] + "</small>";
                item.addEventListener("click", () => {
                    selectVow(i);
                    document.querySelector(".detail").scrollIntoView({ behavior: "smooth", block: "center" });
                    document.querySelector("details").open = false;
                });
                grid.appendChild(item);
            });
            document.getElementById("prev").addEventListener("click", () => selectVow(current - 1));
            document.getElementById("fullscreen").addEventListener("click", async () => {
                try {
                    if (!document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();
                        document.getElementById("fullscreen").textContent = "⤢ 離開全螢幕";
                    } else {
                        await document.exitFullscreen();
                        document.getElementById("fullscreen").textContent = "⛶ 全螢幕";
                    }
                } catch (e) {
                    alert("此瀏覽器目前不支援全螢幕功能。");
                }
            });
            document.addEventListener("fullscreenchange", () => {
                if (!document.fullscreenElement) document.getElementById("fullscreen").textContent = "⛶ 全螢幕";
            });
            document.getElementById("share").addEventListener("click", async () => {
                const data = { title: "藥師琉璃光如來・十二大願", text: "願光明照世，願眾生皆得安樂。" };
                try {
                    if (navigator.share) await navigator.share(data);
                    else if (navigator.clipboard) {
                        await navigator.clipboard.writeText(location.href);
                        alert("已複製網頁網址。若您是直接開啟本機檔案，請將 HTML 檔傳送給對方。");
                    } else alert("請直接分享此 HTML 檔案。");
                } catch (e) {}
            });
            document.getElementById("speak").addEventListener("click", () => {
                if (!("speechSynthesis" in window)) {
                    alert("此瀏覽器不支援語音朗讀。");
                    return;
                }
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                    document.getElementById("speak").textContent = "♫ 朗讀經文";
                    return;
                }
                const u = new SpeechSynthesisUtterance(vows[current][0] + "。" + vows[current][1]);
                u.lang = "zh-TW";
                u.rate = 0.82;
                u.onend = () => (document.getElementById("speak").textContent = "♫ 朗讀經文");
                document.getElementById("speak").textContent = "■ 停止朗讀";
                speechSynthesis.speak(u);
            });
            document.getElementById("next").addEventListener("click", () => selectVow(current + 1));
            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") selectVow(current - 1);
                if (e.key === "ArrowRight") selectVow(current + 1);
            });
            selectVow(0);
        </script>
    </body>
</html>
