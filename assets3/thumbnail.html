<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB 預覽圖生成器 (1200x630) - 東密明王殿</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 導入古典禪意字體：霞鶩文楷 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"LXGW WenKai TC"', '"BiauKai"', '"KaiTi"', '"標楷體"', 'serif'],
                    },
                    colors: {
                        zen: {
                            bg: '#F5F4F1',
                            panel: '#FFFFFF',
                            textMain: '#4A3B32',
                            textHeading: '#2B231D',
                            accent: '#A63A32',
                            gold: '#9C7E5A',
                            border: '#E8E4DB',
                            watermark: 'rgba(43, 35, 29, 0.04)',
                            sub: '#EFE9DD'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #333; /* 外圍深色背景，方便截圖對齊 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'LXGW WenKai TC', serif;
        }

        /* 標準 Facebook Open Graph 圖片尺寸：1200 x 630 */
        .og-canvas {
            width: 1200px;
            height: 630px;
            background-color: var(--theme-bg, #F5F4F1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            /* 讓截圖邊緣更乾淨 */
            border: 1px solid #D5C7AD;
        }

        /* 背景雜訊/紋理模擬 */
        .og-canvas::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 請將這整個 1200x630 的區塊截圖下來 -->
    <div class="og-canvas flex items-center justify-center p-16" id="capture-area">
        
        <!-- 背景巨型浮水印 -->
        <div class="absolute right-[-2rem] top-4 text-[42rem] leading-none text-zen-watermark font-black select-none pointer-events-none z-0 transform -rotate-12">
            心
        </div>
        <div class="absolute left-10 top-10 text-[20rem] text-zen-watermark font-black select-none pointer-events-none z-0 opacity-50 font-sans">
            ☸
        </div>

        <!-- 四周優雅的內邊框 -->
        <div class="absolute inset-8 border border-zen-gold opacity-30 z-10 pointer-events-none"></div>
        <div class="absolute inset-[2.2rem] border border-zen-gold opacity-10 z-10 pointer-events-none"></div>

        <!-- 內容主體 -->
        <div class="relative z-20 w-full flex justify-between items-center px-12">
            
            <!-- 左側：標題與資訊 -->
            <div class="flex-1 max-w-[700px]">
                
                <!-- 寺廟名稱與印章 -->
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-12 h-[1px] bg-zen-gold"></div>
                    <span class="text-2xl font-bold text-zen-gold tracking-[0.3em]">東密明王殿</span>
                    <div class="border-2 border-zen-accent text-zen-accent px-2 py-1 text-sm font-bold tracking-widest rounded-sm transform rotate-[-3deg]">
                        法堂
                    </div>
                </div>

                <!-- 主標題 -->
                <h1 class="text-7xl font-bold text-zen-textHeading leading-tight tracking-[0.1em] mb-4">
                    般若波羅蜜多<span class="text-zen-accent">心經</span>
                </h1>
                
                <!-- 副標題 -->
                <h2 class="text-4xl text-zen-textMain tracking-[0.2em] mb-12 flex items-center gap-4">
                    <span class="inline-block w-3 h-3 bg-zen-accent transform rotate-45"></span>
                    實修十二堂課
                </h2>

                <!-- 簡介文字 -->
                <div class="bg-zen-panel p-6 border-l-4 border-zen-accent rounded-sm shadow-sm inline-block">
                    <p class="text-2xl text-zen-textMain tracking-widest leading-relaxed">
                        打破文字表相，直指修心實踐。<br>
                        循序漸進體悟自覺與覺他的菩薩道。
                    </p>
                </div>
            </div>

            <!-- 右側：法語排版 (直書) -->
            <div class="flex gap-6 h-[400px] items-center text-3xl text-zen-textHeading tracking-[0.4em] font-bold" style="writing-mode: vertical-rl;">
                <div class="border-l border-zen-gold pl-6 flex flex-col items-center justify-center">
                    <p class="mb-4 text-zen-gold">定以蓮師揚佛法、靜以待之渡同門</p>
                </div>
                <div class="flex flex-col items-center justify-center">
                    <p class="mb-4">明以弘法渡陰陽、修以禪宗解六界</p>
                </div>
            </div>

        </div>

        <!-- 底部裝飾 -->
        <div class="absolute bottom-12 left-20 z-20 flex items-center gap-4">
            <span class="text-zen-gold text-2xl font-serif">☸</span>
            <span class="text-zen-gold text-lg tracking-widest opacity-80">數位互動實修法堂</span>
        </div>
    </div>

</body>
</html>
