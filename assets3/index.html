    <!-- Chosen Palette: Dynamic Zen Themes (Default Warm Paper, Cinnabar, Cyan Ink, Dark Night, Pine Grey) -->
    
    <!-- Application Structure Plan: 
         採用「數位互動法堂」的 Master-Detail (主從式) 儀表板架構。
         左側/上方：提供「修行次第」導覽列，將《心經十二堂課筆記》拆解為 12 堂課與總結，降低認知負荷，讓使用者能掌握學習進度並自由跳轉。
         右側/主要內容區：作為「觀照」的空間，動態渲染筆記內容。完美套用了指定的 HTML/CSS 樣式（如 Grid 網格、四宮格互動卡片、高光區塊），將「核心心法」以最易讀且具互動性的卡片式設計呈現。
         懸浮控件：右下角提供「主題切換」功能，適應不同閱讀情境（如夜間）。
    -->
    
    <!-- Visualization & Content Choices: 
         1. 導覽/文本 (Goal: Inform): 使用結構化的排版與重點高亮，讓筆記中的經文、心法一目了然。
         2. 第四、六、八課 (Goal: Organize/Inform): 套用網格(Grid)與彈性盒子(Flex)排版樣式，將「空與色」、「受想行識」等概念具象化分類排列。
         3. 第九課 六根六塵 (Goal: Compare/Relationships): 套用互動式的 HTML Grid 樣式。點擊「六根」，對應的「六塵」會亮起，視覺化展示產生「五毒」的過程。(無 SVG/Mermaid)
         4. 第十課 十二因緣 (Goal: Organize/Process): 使用傳統方印與古典十二宮格排版，呈現十二因緣流轉次第，取代現代圖表，更具禪意。
         5. 第十一課 苦集滅道 (Goal: Organize): 套用四宮格互動卡片 (HTML/CSS) 樣式，將筆記中的八大苦與八正道等概念清晰分類。
    -->
    
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

        tailwind.config = {
            theme: {
                extend: {

                    },
                    colors: {
                        zen: {
                            bg: 'var(--bg-body)',

                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Variables for 5 Zen Themes */
        :root, [data-theme="default"] {
            --bg-body: #F5F4F1; --bg-panel: #FFFFFF; --bg-header: #2B231D; --bg-sub: #EFE9DD; --bg-header-box: #382E26;
            --text-main: #4A3B32; --text-heading: #2B231D; --text-header-main: #FFFFFF; --text-header-sub: #D4CBBF;
            --color-accent: #A63A32; --color-gold: #9C7E5A; --border-main: #E8E4DB; --border-header: #40352C;
            --text-watermark: rgba(43, 35, 29, 0.03); --text-muted: #C4BDB5; --shadow-color: rgba(43, 35, 29, 0.05);
        }
        [data-theme="cinnabar"] {
            --bg-body: #F2E8D5; --bg-panel: #FCF6EB; --bg-header: #1A0E08; --bg-sub: #EADFCA; --bg-header-box: #26160D;
            --text-main: #3A2A22; --text-heading: #1A0E08; --text-header-main: #F2E8D5; --text-header-sub: #C49A2A;
            --color-accent: #C8321F; --color-gold: #C49A2A; --border-main: #DBCDB5; --border-header: #3A2A22;
            --text-watermark: rgba(26, 14, 8, 0.03); --text-muted: #C7B9A3; --shadow-color: rgba(26, 14, 8, 0.06);
        }
        [data-theme="cyan"] {
            --bg-body: #EEF0EC; --bg-panel: #F9FAF8; --bg-header: #1C2325; --bg-sub: #E2E5E0; --bg-header-box: #273133;
            --text-main: #2C3A3D; --text-heading: #1C2325; --text-header-main: #EEF0EC; --text-header-sub: #A0845C;
            --color-accent: #4A7B6F; --color-gold: #A0845C; --border-main: #D4D9D2; --border-header: #35454A;
            --text-watermark: rgba(28, 35, 37, 0.03); --text-muted: #B8C0B5; --shadow-color: rgba(28, 35, 37, 0.04);
        }
        [data-theme="dark"] {
            --bg-body: #100A06; --bg-panel: #1E140D; --bg-header: #0A0604; --bg-sub: #2A1D13; --bg-header-box: #140D08;
            --text-main: #CDBCA7; --text-heading: #F0E6D8; --text-header-main: #D4A93A; --text-header-sub: #A69279;
            --color-accent: #B83228; --color-gold: #D4A93A; --border-main: #3A2A1E; --border-header: #1E140D;
            --text-watermark: rgba(212, 169, 58, 0.02); --text-muted: #5A4839; --shadow-color: rgba(0, 0, 0, 0.5);
        }
        [data-theme="pine"] {
            --bg-body: #F0EDEA; --bg-panel: #FFFFFF; --bg-header: #181818; --bg-sub: #E6E2DE; --bg-header-box: #242424;
            --text-main: #444444; --text-heading: #181818; --text-header-main: #F0EDEA; --text-header-sub: #999999;
            --color-accent: #3D5C4A; --color-gold: #555555; --border-main: #C8C2BA; --border-header: #333333;
            --text-watermark: rgba(24, 24, 24, 0.02); --text-muted: #A39E99; --shadow-color: rgba(24, 24, 24, 0.04);
        }

        /* --- Base Styles --- */
        body {
            font-family: 'LXGW WenKai TC', 'BiauKai', 'KaiTi', '標楷體', serif; 
            background-color: var(--bg-body); color: var(--text-main);
            letter-spacing: 0.08em; /* 稍微加寬字距以適應楷體特性 */
            overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Chart Container Constraints (Critical) --- */
        .chart-container {
            position: relative; width: 100%; max-width: 450px; margin: 0 auto; 
            height: 40vh; max-height: 400px; min-height: 300px;
        }
        @media (min-width: 768px) { .chart-container { height: 50vh; } }
        
        .zen-panel { background-color: var(--bg-panel); border: 1px solid var(--border-main); box-shadow: 0 10px 30px var(--shadow-color); border-radius: 4px; transition: all 0.4s ease; }
        
        /* --- Custom Scrollbar --- */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--bg-sub); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--color-gold); }

        /* ================= Animations & Effects ================= */
        
        /* 1. Header Staggered Entry */
        @keyframes drop-fade {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .header-stagger-1 { animation: drop-fade 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.1s backwards; }
        .header-stagger-2 { animation: drop-fade 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s backwards; }
        .header-stagger-3 { animation: drop-fade 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s backwards; }

        /* 2. Background Breathing Text */
        @keyframes watermark-breathe {
            0%, 100% { transform: scale(1); opacity: 0.04; }
            50% { transform: scale(1.04); opacity: 0.07; }
        }
        .watermark-breathe { animation: watermark-breathe 12s ease-in-out infinite; }

        /* 3. Theme Button Auto Ripple */
        @keyframes auto-ripple-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            20% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .auto-ripple-container { position: relative; width: 3rem; height: 3rem; }
        .auto-ripple-ring::before, .auto-ripple-ring::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--color-accent);
            background-color: var(--color-gold); animation: auto-ripple-ring 10s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
            z-index: 0; pointer-events: none;
        }
        .auto-ripple-ring::after { animation-delay: 0.8s; }

        /* 4. Content Blur Transition */
        @keyframes content-blur-out {
            0% { opacity: 1; filter: blur(0px); transform: translateY(0); }
            100% { opacity: 0; filter: blur(8px); transform: translateY(15px); }
        }
        @keyframes content-blur-in {
            0% { opacity: 0; filter: blur(8px); transform: translateY(-15px); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
        }
        .content-exit { animation: content-blur-out 0.3s forwards; }
        .content-enter { animation: content-blur-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        .child-stagger { opacity: 0; }
        .content-enter .child-stagger:nth-child(1) { animation: drop-fade 0.6s 0.1s forwards; }
        .content-enter .child-stagger:nth-child(2) { animation: drop-fade 0.6s 0.2s forwards; }
        .content-enter .child-stagger:nth-child(3) { animation: drop-fade 0.6s 0.3s forwards; }
        .content-enter .child-stagger:nth-child(4) { animation: drop-fade 0.6s 0.4s forwards; }
        .content-enter .child-stagger:nth-child(5) { animation: drop-fade 0.6s 0.5s forwards; }
        .content-enter .child-stagger:nth-child(6) { animation: drop-fade 0.6s 0.6s forwards; }
        .content-enter .child-stagger:nth-child(7) { animation: drop-fade 0.6s 0.7s forwards; }
        .content-enter .child-stagger:nth-child(8) { animation: drop-fade 0.6s 0.8s forwards; }
        .content-enter .child-stagger:nth-child(9) { animation: drop-fade 0.6s 0.9s forwards; }
        .content-enter .child-stagger:nth-child(10) { animation: drop-fade 0.6s 1.0s forwards; }

        /* 5. Navigation Items */
        @keyframes slide-right {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .nav-item {
            position: relative; overflow: hidden; transition: all 0.3s ease; border-left: 2px solid transparent; border-radius: 4px;
        }
        .nav-item::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg); transition: left 0.5s ease; z-index: 1; pointer-events: none;
        }
        .nav-item:hover::after { left: 150%; }
        .nav-item:hover { background-color: var(--bg-body); color: var(--color-accent); }
        .nav-item-active { font-weight: 700; color: var(--color-accent) !important; border-left-color: var(--color-accent) !important; border-left-width: 3px !important; background-color: var(--bg-body) !important; }

        /* 6. Title Drawing Underline */
        @keyframes draw-line { 0% { width: 0; } 100% { width: 100%; } }
        .draw-underline { position: relative; display: inline-block; padding-bottom: 0.5rem; }
        .draw-underline::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            height: 1px; background-color: var(--color-accent); width: 0;
            animation: draw-line 1s cubic-bezier(0.25, 1, 0.5, 1) 0.4s forwards;
        }

        /* 7. Interactive Cards Elasticity */
        .interactive-card { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, border-color 0.4s ease; }
        .interactive-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 20px var(--shadow-color); border-color: var(--border-main); z-index: 10;}

        /* 8. Elastic Theme Menu */
        .elastic-menu { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease; }
        .menu-hidden { opacity: 0; transform: scale(0.8) translateY(10px); pointer-events: none; }
        .menu-visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        /* 9. Click Ripple */
        .ripple-btn { position: relative; overflow: hidden; cursor: pointer; }
        .ripple-btn .ripple {
            position: absolute; border-radius: 50%; background: var(--color-accent); opacity: 0.18;
            transform: scale(0); animation: rippleAnim 0.55s linear; pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        /* Global Theme Transition */
        .theme-transitioning, .theme-transitioning * { transition: background-color 0.8s ease-in-out, color 0.8s ease-in-out, border-color 0.8s ease-in-out, box-shadow 0.8s ease-in-out !important; }
    </style>
</head>

            const totalLessons = sutraData.length - 1; 
            const progressPercentage = (currentIndex / totalLessons) * 100;
            const progressBar = document.getElementById('scroll-progress-sidebar');
            if(progressBar) {
                progressBar.style.width = progressPercentage + '%';
            }
        }

        // --- Ink Particles Animation (Canvas) ---
        function initInkParticles() {
            const canvas = document.getElementById('ink-particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const particleCount = 55;

            function resize() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.3; 
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.radius = Math.random() * 2 + 0.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                    if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = getThemeColor('--color-gold'); 
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = getThemeColor('--color-gold');
                            ctx.globalAlpha = 1 - (dist / 100);
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                            ctx.globalAlpha = 1; 
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- Initialization ---
        function initApp() {
            const savedTheme = localStorage.getItem('zen-theme') || 'default';
            document.documentElement.setAttribute('data-theme', savedTheme);
            currentThemeId = savedTheme;

            document.getElementById('total-count').innerText = sutraData.length - 1;

            const navContainer = document.getElementById('lesson-nav');
            const mobileNav = document.getElementById('mobile-nav');
            
            sutraData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'ripple-btn nav-item text-left px-5 py-3 rounded-sm text-zen-textMain text-sm md:text-base tracking-widest w-full flex items-start gap-3 border-transparent opacity-0 leading-relaxed flex-shrink-0 transition-colors font-serif';
                btn.id = `nav-${item.id}`;
                btn.onclick = () => loadContent(item.id, true);
                btn.style.animation = `slide-right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) ${index * 0.05}s forwards`;
                
                let iconStr = `<span class="text-zen-gold text-xs pointer-events-none mt-1 flex-shrink-0">${item.icon}</span>`;
                if(item.type === 'summary') iconStr = `<span class="text-zen-accent text-xs pointer-events-none mt-1 flex-shrink-0">${item.icon}</span>`;

                btn.innerHTML = `${iconStr} <span class="pointer-events-none flex-1 whitespace-normal">${item.title}</span>`;
                navContainer.appendChild(btn);

                if (mobileNav) {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = `${item.icon} ${item.title}`;
                    mobileNav.appendChild(option);
                }
            });

            loadContent('intro');
            initInkParticles();
        }

        // --- Content Rendering ---
        function loadContent(id, shouldScroll = false) {
            if (isTransitioning) return;
            isTransitioning = true;

            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('nav-item-active'));
            const activeBtn = document.getElementById(`nav-${id}`);
            if(activeBtn) activeBtn.classList.add('nav-item-active');

            const mobileNav = document.getElementById('mobile-nav');
            if(mobileNav) mobileNav.value = id;

            const currentIndex = sutraData.findIndex(item => item.id === id);
            document.getElementById('progress-count').innerText = id === 'intro' ? '0' : currentIndex;
            updateScrollProgress(currentIndex);

            const data = sutraData.find(item => item.id === id);
            if (!data) { isTransitioning = false; return; }

            const container = document.getElementById('content-display');
            container.classList.remove('content-enter');
            container.classList.add('content-exit');

            setTimeout(() => {
                let htmlContent = '';

                if (data.type === 'intro') {
                    htmlContent = data.content;
                } else {
                    let headerBadge = data.phase ? 
                        `<div class="child-stagger mb-2 text-zen-gold tracking-[0.2em] text-xs font-bold flex items-center gap-3 transition-colors uppercase font-serif">${data.phase}</div>` : '';

                    htmlContent = `
                        ${headerBadge}
                        <div class="child-stagger mb-5 text-zen-accent tracking-[0.2em] text-sm font-bold flex items-center gap-3 transition-colors font-serif">
                            <span class="w-6 h-[1px] bg-zen-accent"></span> ${data.title}
                        </div>
                        <div class="child-stagger draw-underline text-center mb-10 w-full inline-block">
                            <h2 class="text-2xl md:text-3xl font-bold text-zen-textHeading tracking-widest leading-loose transition-colors font-serif">
                                「${data.sutra}」
                            </h2>
                        </div>
                        <div class="mb-10 text-zen-textMain transition-colors font-serif">
                            ${data.body}
                        </div>
                    `;

                    if (data.takeawayTitle) {
                        htmlContent += `
                            <div class="child-stagger mt-auto bg-zen-bg p-8 rounded-sm border-l-4 border-zen-accent transition-colors shadow-sm">
                                <h3 class="text-lg font-bold text-zen-textHeading mb-4 tracking-widest font-serif"><span class="text-zen-accent">【${data.takeawayTitle}】</span></h3>
                                <p class="text-zen-textMain leading-loose text-justify font-bold font-serif">${data.takeawayBody}</p>
                            </div>
                        `;
                    }

                    let bottomNavHtml = '<div class="child-stagger flex flex-col md:flex-row justify-between items-center mt-12 pt-8 border-t border-zen-border gap-4 transition-colors w-full">';

                    if (currentIndex > 0) {
                        const prevItem = sutraData[currentIndex - 1];
                        bottomNavHtml += `<button onclick="loadContent('${prevItem.id}', true)" class="ripple-btn w-full md:w-auto text-center md:text-left px-6 py-3 rounded-sm border border-zen-border bg-zen-bg text-zen-textMain hover:bg-zen-panel hover:border-zen-accent hover:text-zen-accent transition-all shadow-sm tracking-widest flex items-center font-serif"><span class="text-[10px] mr-2 text-zen-gold pointer-events-none flex-shrink-0">▲</span><span class="pointer-events-none flex-1 whitespace-normal">上一單元：${prevItem.title}</span></button>`;
                    } else {
                        bottomNavHtml += `<div class="hidden md:block w-full md:w-auto"></div>`; 
                    }

                    if (currentIndex < sutraData.length - 1) {
                        const nextItem = sutraData[currentIndex + 1];
                        bottomNavHtml += `<button onclick="loadContent('${nextItem.id}', true)" class="ripple-btn w-full md:w-auto text-center md:text-right px-6 py-3 rounded-sm border border-zen-border bg-zen-bg text-zen-textMain hover:bg-zen-panel hover:border-zen-accent hover:text-zen-accent transition-all shadow-sm tracking-widest flex items-center justify-end font-serif"><span class="pointer-events-none flex-1 whitespace-normal text-right">下一單元：${nextItem.title}</span><span class="text-[10px] ml-2 text-zen-gold pointer-events-none flex-shrink-0">▼</span></button>`;
                    } else {
                        bottomNavHtml += `<div class="hidden md:block w-full md:w-auto"></div>`;
                    }
                    
                    bottomNavHtml += '</div>';
                    htmlContent += bottomNavHtml;
                }

                container.innerHTML = htmlContent;
                
                container.classList.remove('content-exit');
                void container.offsetWidth; 
                container.classList.add('content-enter');

                if (data.hasChart) {
                    setTimeout(renderChart, 100);
                } else if (currentChartInstance) {
                    currentChartInstance.destroy();
                    currentChartInstance = null;
                }

                if (shouldScroll) {
                    const yOffset = window.innerWidth < 768 ? -100 : -40; 
                    const y = container.getBoundingClientRect().top + window.scrollY + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }

                isTransitioning = false;
            }, 300);
        }

        // --- Lesson 9 Specific Interaction ---
        function highlightDust(rootId, event) {
            document.querySelectorAll('.dust-item').forEach(el => {
                el.className = 'dust-item bg-zen-panel p-4 rounded-sm border border-transparent text-zen-muted transition-all flex items-center h-full font-serif';
            });
            document.querySelectorAll('.root-btn').forEach(el => {
                el.className = 'ripple-btn root-btn interactive-card bg-zen-sub p-4 rounded-sm border border-zen-border text-left hover:border-zen-accent text-zen-textMain font-bold font-serif';
            });

            event.currentTarget.classList.add('border-zen-accent', 'bg-zen-panel');
            event.currentTarget.classList.remove('border-zen-border', 'bg-zen-sub');

            const targetDust = document.getElementById(`dust-${rootId}`);
            if (targetDust) {
                targetDust.className = 'dust-item bg-zen-header p-4 rounded-sm border border-zen-borderHeader text-zen-textHeaderMain transition-all flex items-center h-full shadow-md font-bold text-lg font-serif';
            }
        }

        // --- Lesson 10 Chart.js ---
        function renderChart() {
            const ctx = document.getElementById('nidanaChart').getContext('2d');
            if (currentChartInstance) currentChartInstance.destroy();

            const labels = nidanaDescriptions;
            const dataValues = Array(12).fill(1);
            const bgColors = chartPalettes[currentThemeId] || chartPalettes['default'];

            currentChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues, backgroundColor: bgColors,
                        borderWidth: 2, borderColor: getThemeColor('--bg-panel'), hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '55%',
                    animation: { animateScale: true, animateRotate: true },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: { label: function(context) { return ' 第' + (context.dataIndex + 1) + '因緣: ' + context.label; } },
                            backgroundColor: getThemeColor('--bg-headerBox'),
                            titleFont: { family: "'LXGW WenKai TC', 'BiauKai', serif", size: 14 },
                            bodyFont: { family: "'LXGW WenKai TC', 'BiauKai', serif", size: 13 },
                            titleColor: getThemeColor('--text-header-main'),
                            bodyColor: getThemeColor('--text-header-main'),
                            padding: 12, displayColors: false
                        }
                    },
                    onClick: (event, elements) => {
                        const detailBox = document.getElementById('chart-detail-box');
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            detailBox.innerHTML = `<span class="text-zen-accent text-lg leading-loose font-serif">${nidanaDescriptions[index]}</span>`;
                            detailBox.className = 'mt-8 p-5 bg-zen-panel rounded-sm border border-zen-accent shadow-md text-center min-h-[5rem] flex items-center justify-center font-bold transition-all tracking-widest text-zen-textMain font-serif';
                        } else {
                            detailBox.innerHTML = '點擊上方圖表區塊以查看節點解說';
                            detailBox.className = 'mt-8 p-5 bg-zen-bg rounded-sm border border-zen-border text-center min-h-[5rem] flex items-center justify-center font-bold transition-all tracking-widest text-zen-textMain font-serif';
                        }
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);

    </script>
