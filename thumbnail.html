<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明王殿因緣記 - 網頁縮圖生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            /* 用於展示預覽的深色背景 */
            background-color: #1c1917; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .serif {
            font-family: 'Noto Serif TC', serif;
        }

        /* 標準社群分享圖尺寸 (1200x630) */
        .thumbnail-canvas {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background-color: #1c1917; /* stone-900 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* CSS 繪製的光暈效果（象徵神明的金光與明王的火焰） */
        .glow-orb {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(217,119,6,0.15) 0%, rgba(28,25,23,0) 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            pointer-events: none;
        }

        .glow-orb-red {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(220,38,38,0.1) 0%, rgba(28,25,23,0) 70%);
            bottom: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* 幾何裝飾線條（象徵心境軌跡） */
        .chart-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            opacity: 0.2;
            background: linear-gradient(to top right, transparent 49%, #f59e0b 49%, #f59e0b 51%, transparent 51%);
            background-size: 200px 200px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 截圖區域 (1200x630) -->
    <div class="thumbnail-canvas flex flex-col justify-between border border-stone-800">
        
        <!-- 背景光暈裝飾 -->
        <div class="glow-orb"></div>
        <div class="glow-orb-red"></div>
        <div class="chart-line"></div>
        
        <!-- 頂部裝飾線 -->
        <div class="w-full h-3 bg-gradient-to-r from-red-700 via-amber-500 to-blue-700"></div>

        <div class="flex-grow flex items-center px-16 relative z-10">
            <div class="w-full flex justify-between items-center">
                
                <!-- 左側：主標題與副標題 -->
                <div class="max-w-2xl">
                    <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-amber-300 to-amber-600 serif tracking-widest leading-tight mb-6" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                        明王殿<br>因緣記
                    </h1>
                    <p class="text-3xl text-stone-300 font-light tracking-wider border-l-4 border-red-700 pl-6 py-2">
                        明法大師兄略傳：<br>
                        <span class="text-2xl text-stone-400 mt-2 inline-block">從陰陽眼童年到東密傳承的靈性覺醒之旅</span>
                    </p>
                </div>

                <!-- 右側：核心偈語 -->
                <div class="pl-12 border-l border-stone-700/50">
                    <p class="serif text-2xl leading-loose tracking-[0.2em] text-amber-100/90" style="writing-mode: vertical-rl; text-orientation: upright;">
                        明以三藏度陰陽<br>
                        法以佛道解六界<br>
                        定以蓮師揚佛法<br>
                        靜以待之度眾生
                    </p>
                </div>

            </div>
        </div>

        <!-- 底部資訊 -->
        <div class="px-16 pb-10 relative z-10 flex justify-between items-end">
            <div class="text-stone-500 text-xl font-medium tracking-widest">
                以顯為基 ｜ 以密救世
            </div>
            <div class="flex gap-3">
                <div class="w-3 h-3 bg-stone-600 rounded-full"></div>
                <div class="w-3 h-3 bg-amber-600 rounded-full"></div>
                <div class="w-3 h-3 bg-red-700 rounded-full"></div>
            </div>
        </div>
    </div>

</body>
</html>
